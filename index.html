};

// ================= PROFILE =================
async function renderProfile(userId) {
  const isMe = userId === me.id;
  const host = $('otherPage');
  host.className = 'fade-in';
  host.innerHTML = loaderHtml;

  let targetUser = profileCache[userId];
  if (!targetUser || isMe) {
    const { data } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
    targetUser = data;
    if (isMe && data) me = data;
  }
  if (!targetUser) return host.innerHTML = emptyHtml('user', 'المستخدم غير موجود.');
  profileCache[userId] = targetUser;

  const { data: posts } = await supabaseClient.from('posts').select('*').eq('author_id', userId).is('deleted_at', null).order('created_at', {ascending: false});
  const postIds = posts?.map(p => p.id) || [];
  const { data: media } = await supabaseClient.from('post_media').select('*').in('post_id', postIds);
  const { count: friendsCount } = await supabaseClient.from('friendships').select('*', { count: 'exact', head: true }).or(`requester_id.eq.${userId},addressee_id.eq.${userId}`).eq('status', 'accepted');
  let likesReceived = 0;
  if (postIds.length) {
    const { count } = await supabaseClient.from('likes').select('*', { count: 'exact', head: true }).in('post_id', postIds);
    likesReceived = count || 0;
  }

  let friendStatus = 'none';
  if (!isMe) {
    const { data: f } = await supabaseClient.from('friendships').select('status').or(`and(requester_id.eq.${userId},addressee_id.eq.${me.id}),and(requester_id.eq.${me.id},addressee_id.eq.${userId})`).maybeSingle();
    if (f) friendStatus = f.status;
  }

  const coverUrl = targetUser.cover_url || '';
  const avatarUrl = targetUser.avatar_url || '';
  const coverStyle = coverUrl ? `background-image:url('${coverUrl}')` : '';

  const actionButtons = isMe ? `
    <div class="tp-action-row">
      <button class="tp-action-btn main" onclick="showEditProfileModal()">${ico('edit', 17)} تعديل الملف الشخصي</button>
      <button class="tp-action-btn" onclick="openSettingsModal()">${ico('settings', 17)} الإعدادات</button>${isAdminMe ? `<button class="tp-action-btn main" onclick="renderAdmin()">${ico('shield', 17)} لوحة المشرف</button>` : ''}
    </div>` : `
    <div class="tp-action-row">
      <button class="tp-action-btn main" onclick="goToChat('${userId}')">${ico('msg', 17)} مراسلة</button>
      ${friendStatus === 'accepted' ? `<button class="tp-action-btn" disabled>${ico('check', 17)} صديق</button>` :
        friendStatus === 'pending' ? `<button class="tp-action-btn" disabled>طلب مرسل</button>` :
        `<button class="tp-action-btn" onclick="sendFriendRequest('${userId}', this)">${ico('plus', 17)} إضافة صديق</button>`}
    </div>`;

  host.innerHTML = `
    <div class="tp-container">
      <div class="tp-cover ${isMe ? 'editable' : ''}" style="${coverStyle}" ${isMe ? `onclick="document.getElementById('coverUploadInput').click()"` : ''}>
        ${isMe ? `<div class="cover-hint">${ico('camera', 20)} تغيير الغلاف</div><input type="file" id="coverUploadInput" accept="image/*" hidden onchange="uploadProfileImage(this.files[0], 'cover_url', 'cover')">` : ''}
        ${isMe ? `<div class="tp-top-actions" onclick="event.stopPropagation()"><button class="tp-icon-btn" onclick="showEditProfileModal()" title="تعديل الملف">${ico('edit', 17)}</button></div>` : ''}
      </div>
      <div class="tp-avatar-wrap ${isMe ? 'editable' : ''}" ${isMe ? `onclick="document.getElementById('avatarUploadInput').click()"` : ''}>
        ${targetUser.frame === 'shield' ? '<img class="av-ring" src="' + SHIELD_IMG + '" alt="">' : ''}
        <div class="in">${avatarUrl ? `<img src="${avatarUrl}" alt="">` : `<div class="ph">${esc(targetUser.full_name?.[0] || 'و')}</div>`}</div>
        ${isMe ? `<input type="file" id="avatarUploadInput" accept="image/*" hidden onchange="uploadProfileImage(this.files[0], 'avatar_url', 'avatar')">` : ''}
      </div>

      <div class="tp-info-section">
        <div class="tp-name">${esc(targetUser.full_name)} ${targetUser.is_verified ? `<span class="verified-badge" title="حساب موثّق"></span>` : ''}</div>
        <div class="tp-handle">@${esc(targetUser.username || 'user_' + String(targetUser.id).substring(0,4))}</div>
        ${targetUser.bio || isMe ? `<div class="tp-bio ${isMe ? 'me' : ''}" ${isMe ? 'onclick="showEditProfileModal()"' : ''}>${targetUser.bio ? esc(targetUser.bio) : '+ أضف نبذة عنك'}</div>` : ''}
        <div class="tp-stats">
          <div class="tp-stat-item"><span class="tp-stat-num">${posts?.length || 0}</span><span class="tp-stat-label">منشورات</span></div>
          <div class="tp-stat-item"><span class="tp-stat-num">${friendsCount || 0}</span><span class="tp-stat-label">أصدقاء</span></div>
          <div class="tp-stat-item"><span class="tp-stat-num">${likesReceived}</span><span class="tp-stat-label">إعجابات</span></div>
        </div>
        ${actionButtons}
      </div>

      <div class="tp-tabs"><i data-ico="grid" data-s="18"></i> المنشورات <span>${posts?.length || 0}</span></div>
      <div class="tp-grid">
        ${posts?.length ? posts.map(p => {
          const m = media?.find(x => x.post_id === p.id);
          postCache[p.id] = p.content || '';
          return `<div class="tp-grid-item" onclick="${m ? '' : `toast('${esc((p.content || '').substring(0, 50)).replace(/\n/g, ' ')}')`}">${m ? (m.media_type === 'video' ? `<video src="${m.media_url}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video><span class="tp-grid-vid">${ico('reel', 18)}</span>` : `<img src="${m.media_url}" alt="">`) : `<div class="tp-grid-text">${esc((p.content || 'منشور').substring(0, 60))}</div>`}</div>`;
        }).join('') : `<div style="grid-column:1/-1">${emptyHtml('image', 'لا توجد منشورات بعد.')}</div>`}
      </div>
    </div>`;
  hydrateIcons(host);
}

// ================= FEED & COMPOSER =================
$('postMedia').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  selectedMediaFile = file; const url = URL.createObjectURL(file);
  $('mediaPreviewBox').classList.remove('hidden');
  if (file.type.startsWith('video')) { $('previewVid').src = url; $('previewVid').classList.remove('hidden'); $('previewImg').classList.add('hidden'); }
  else { $('previewImg').src = url; $('previewImg').classList.remove('hidden'); $('previewVid').classList.add('hidden'); }
};
window.clearMedia = () => { selectedMediaFile = null; $('postMedia').value = ''; $('mediaPreviewBox').classList.add('hidden'); };

$('btnPublish').onclick = async () => {
  const text = $('postText').value.trim();
  if (!text && !selectedMediaFile) return toast('اكتب شيئاً أو أضف وسائط');
  if (!moderateText(text).ok) return toast('المحتوى يحتوي على كلمات ممنوعة.');
  const btn = $('btnPublish'); btn.disabled = true; btn.textContent = 'جاري النشر...';
  try {
    let mediaUrl = null, mediaType = null;
    if (selectedMediaFile) {
      mediaType = selectedMediaFile.type.startsWith('video') ? 'video' : 'image';
      const path = `${me.id}/${Date.now()}.${selectedMediaFile.name.split('.').pop()}`;
      const { error: upErr } = await supabaseClient.storage.from('post-images').upload(path, selectedMediaFile);
      if (upErr) throw upErr;
      const { data } = supabaseClient.storage.from('post-images').getPublicUrl(path);
      mediaUrl = data.publicUrl;
    }
    const { data: post, error } = await supabaseClient.from('posts').insert({ author_id: me.id, content: text }).select().single();
    if (error) throw error;
    if (mediaUrl) await supabaseClient.from('post_media').insert({ post_id: post.id, uploader_id: me.id, media_url: mediaUrl, media_type: mediaType });
    $('postText').value = ''; clearMedia(); toast('تم النشر بنجاح 💜'); loadFeed();
  } catch (err) { toast('فشل النشر: ' + err.message); }
  finally { btn.disabled = false; btn.textContent = 'نشر'; }
};

async function loadFeed() {
  const feed = $('feed'); feed.innerHTML = loaderHtml;
  const { data: posts } = await supabaseClient.from('posts').select('*').is('deleted_at', null).order('created_at', { ascending: false }).limit(20);
  if (!posts || posts.length === 0) return feed.innerHTML = `<div class="glass-card">${emptyHtml('image', 'لا توجد منشورات بعد — كن أول من ينشر!')}</div>`;
  const { data: media } = await supabaseClient.from('post_media').select('*').in('post_id', posts.map(p => p.id));
  const { data: likes } = await supabaseClient.from('likes').select('*').in('post_id', posts.map(p => p.id));
  const uids = [...new Set(posts.map(p => p.author_id))];
  const { data: profiles } = await supabaseClient.from('profiles').select('*').in('id', uids);
  profiles.forEach(p => profileCache[p.id] = p);

  feed.innerHTML = posts.map(post => {
    postCache[post.id] = post.content || '';
    const author = profileCache[post.author_id] || { id: post.author_id, full_name: 'مستخدم' };
    const m = media?.find(x => x.post_id === post.id);
    const isOwner = post.author_id === me.id;
    const menuBtn = isOwner ? `<button class="post-menu" onclick="openPostMenu('${post.id}')">${ico('more', 20)}</button>` : '';
    const postLikes = likes?.filter(l => l.post_id === post.id) || [];
    const isLiked = postLikes.some(l => l.user_id === me.id);
    return `
    <div class="glass-card post-card fade-in">
      <div class="post-header">
        ${avatarHtml(author)}
        <div class="post-author" onclick="viewUserProfile('${author.id}')">
          <div class="nm">${esc(author.full_name)} ${author.is_verified ? `<span class="verified-badge"></span>` : ''}</div>
          <div class="muted" style="font-size:11.5px;">${timeAgo(post.created_at)}</div>
        </div>
        ${menuBtn}
      </div>
      ${post.content ? `<div class="post-text">${esc(post.content)}</div>` : ''}
      ${m ? (m.media_type === 'video' ? `<video class="post-media" controls controlsList="nodownload" src="${m.media_url}"></video>` : `<img class="post-media" src="${m.media_url}" alt="" loading="lazy">`) : ''}
      <div class="post-actions">
        <div class="action-btn ${isLiked ? 'liked' : ''}" data-count="${postLikes.length}" onclick="togglePostLike('${post.id}', this)">${ico('heart', 20)}<span>${postLikes.length > 0 ? postLikes.length : 'إعجاب'}</span></div>
        <div class="action-btn" onclick="showPostComments('${post.id}')">${ico('comment', 20)}<span>تعليق</span></div>
        <div class="action-btn" onclick="sharePost('${post.id}')">${ico('share', 20)}<span>مشاركة</span></div>
      </div>
    </div>`;
  }).join('');
}

async function togglePostLike(postId, btn) {
  const isLiked = btn.classList.contains('liked');
  let count = parseInt(btn.dataset.count || '0');
  if (isLiked) {
    await supabaseClient.from('likes').delete().match({ post_id: postId, user_id: me.id });
    btn.classList.remove('liked'); count = Math.max(0, count - 1);
  } else {
    await supabaseClient.from('likes').insert({ post_id: postId, user_id: me.id });
    btn.classList.add('liked'); count++;
  }
  btn.dataset.count = count;
  btn.querySelector('span').textContent = count > 0 ? count : 'إعجاب';
}

function showPostComments(postId) {
  $('modalRoot').innerHTML = `<div class="modal-overlay" onclick="document.getElementById('modalRoot').innerHTML=''"><div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><span>التعليقات</span><button class="modal-close" onclick="document.getElementById('modalRoot').innerHTML=''">${ico('x', 16)}</button></div><div class="comments-list" id="postCommentsList">${loaderHtml}</div><div style="display:flex; gap:8px;"><input type="text" id="postCommentInput" class="form-input" placeholder="أضف تعليقاً..." onkeypress="if(event.key==='Enter') addPostComment('${postId}')"><button class="btn-primary" style="width:auto; padding:0 20px; border-radius:14px;" onclick="addPostComment('${postId}')">إرسال</button></div></div></div>`;
  const fetchComments = async () => {
    const { data: comments } = await supabaseClient.from('comments').select('*').eq('post_id', postId).order('created_at', {ascending: true});
    const list = $('postCommentsList'); if (!list) return;
    if (!comments || comments.length === 0) return list.innerHTML = '<div class="muted" style="text-align:center;padding:16px">لا توجد تعليقات بعد.</div>';
    const uids = [...new Set(comments.map(c => c.user_id || c.author_id))];
    const { data: profiles } = await supabaseClient.from('profiles').select('*').in('id', uids);
    profiles.forEach(p => profileCache[p.id] = p);
    list.innerHTML = comments.map(c => {
      const uid = c.user_id || c.author_id;
      const p = profileCache[uid] || {full_name: 'مستخدم'};
      return `<div class="comment-item">${avatarHtml(p)}<div class="text"><span class="name" onclick="document.getElementById('modalRoot').innerHTML=''; viewUserProfile('${uid}')">${esc(p.full_name)} ${p.is_verified ? '<span class="verified-badge"></span>' : ''}</span>${esc(c.content)}</div></div>`;
    }).join('');
    list.scrollTop = list.scrollHeight;
  };
  window.addPostComment = async (pid) => {
    const text = $('postCommentInput').value.trim(); if (!text) return;
    if (!moderateText(text).ok) return toast('تعليق ممنوع');
    $('postCommentInput').value = '';
    await supabaseClient.from('comments').insert({ post_id: pid, author_id: me.id, content: text });
    fetchComments();
  };
  fetchComments();
}

async function sharePost(postId) {
  try { await navigator.clipboard.writeText(`${location.origin}${location.pathname}#post-${postId}`); toast('تم نسخ رابط المنشور 🔗'); }
  catch { toast('تعذر نسخ الرابط'); }
}

function openSearchModal() {
  $('modalRoot').innerHTML = `<div class="modal-overlay" onclick="document.getElementById('modalRoot').innerHTML=''"><div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><span>البحث</span><button class="modal-close" onclick="document.getElementById('modalRoot').innerHTML=''">${ico('x', 16)}</button></div><input type="text" id="globalSearchInput" class="form-input" placeholder="ابحث بالاسم أو اسم المستخدم..." oninput="performGlobalSearch(this.value)" autofocus><div id="searchResultsList" style="margin-top:14px;display:flex;flex-direction:column;gap:4px;"></div></div></div>`;
  setTimeout(() => $('globalSearchInput')?.focus(), 50);
}
let searchTimeout;
async function performGlobalSearch(val) {
  clearTimeout(searchTimeout);
  const query = val.trim();
  const list = $('searchResultsList');
  if (!query) { list.innerHTML = ''; return; }
  searchTimeout = setTimeout(async () => {
    list.innerHTML = loaderHtml;
    const { data: profiles } = await supabaseClient.from('profiles').select('*').neq('id', me.id).or(`full_name.ilike.%${query}%,username.ilike.%${query}%`).limit(10);
    if (!profiles || profiles.length === 0) { list.innerHTML = '<div class="muted" style="text-align:center;padding:14px;">لا توجد نتائج مطابقة.</div>'; return; }
    list.innerHTML = profiles.map(p => `
      <div class="notif-item" onclick="document.getElementById('modalRoot').innerHTML=''; viewUserProfile('${p.id}');">
        ${avatarHtml({ ...p, id: null })}
        <div class="notif-text"><strong style="display:block;">${esc(p.full_name)} ${p.is_verified ? '<span class="verified-badge"></span>' : ''}</strong><span class="muted small">@${esc(p.username || 'user')}</span></div>
        <span style="color:var(--primary-2);font-size:13px;font-weight:800;">عرض</span>
      </div>`).join('');
  }, 400);
}

async function openNotifications() {
  $('notifDot').classList.add('hidden');
  $('modalRoot').innerHTML = `<div class="modal-overlay" onclick="document.getElementById('modalRoot').innerHTML=''"><div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><span>الإشعارات</span><button class="modal-close" onclick="document.getElementById('modalRoot').innerHTML=''">${ico('x', 16)}</button></div><div id="notifList">${loaderHtml}</div></div></div>`;
  const { data: myPosts } = await supabaseClient.from('posts').select('id, content').eq('author_id', me.id);
  if (!myPosts || myPosts.length === 0) return $('notifList').innerHTML = emptyHtml('bell', 'لا توجد إشعارات حالياً.');
  const postIds = myPosts.map(p => p.id);
  const { data: likes } = await supabaseClient.from('likes').select('*').in('post_id', postIds).neq('user_id', me.id).order('created_at', {ascending: false}).limit(10);
  const { data: comments } = await supabaseClient.from('comments').select('*').in('post_id', postIds).neq('author_id', me.id).order('created_at', {ascending: false}).limit(10);

  const allNotifs = [];
  const uids = [...new Set([...(likes||[]).map(l=>l.user_id), ...(comments||[]).map(c=>c.author_id)])];
  if (uids.length) {
    const { data: profiles } = await supabaseClient.from('profiles').select('*').in('id', uids);
    profiles.forEach(p => profileCache[p.id] = p);
  }
  (likes||[]).forEach(l => allNotifs.push({ type: 'like', user: profileCache[l.user_id], time: l.created_at }));
  (comments||[]).forEach(c => allNotifs.push({ type: 'comment', user: profileCache[c.author_id], time: c.created_at, comment: c.content }));
  allNotifs.sort((a,b) => new Date(b.time) - new Date(a.time));
  const valid = allNotifs.filter(n => n.user);
  if (valid.length === 0) return $('notifList').innerHTML = emptyHtml('bell', 'لا توجد إشعارات جديدة.');
  $('notifList').innerHTML = valid.slice(0, 15).map(n => `
    <div class="notif-item" onclick="document.getElementById('modalRoot').innerHTML=''; viewUserProfile('${n.user.id}');">
      ${avatarHtml({ ...n.user, id: null })}
      <div class="notif-text"><strong>${esc(n.user.full_name || 'مستخدم')} ${n.user.is_verified ? '<span class="verified-badge"></span>' : ''}</strong> ${n.type === 'like' ? 'أعجب بمنشورك.' : `علّق: "${esc(n.comment)}"`}<div class="notif-time">${timeAgo(n.time)}</div></div>
    </div>`).join('');
}

function openStoryViewer(stories, profile) {
  if (!stories || !stories.length) return;
  let idx = 0, timer;
  const viewer = document.createElement('div');
  viewer.className = 'story-viewer';
  document.body.appendChild(viewer);
  const close = () => { clearTimeout(timer); viewer.remove(); };
  const render = () => {
    const s = stories[idx];
    viewer.innerHTML = `
      <div class="story-progress">${stories.map((_, i) => `<div class="p-bar"><div class="p-fill" id="fill-${i}" style="width:${i < idx ? '100%' : '0%'}"></div></div>`).join('')}</div>
      <div class="story-header">${avatarHtml({ ...profile, id: null })}<strong>${esc(profile.full_name)}</strong><button style="margin-inline-start:auto;color:#fff;" id="stClose">${ico('x', 26)}</button></div>
      <div class="story-content" id="stContent">${s.media_type === 'video' ? `<video src="${s.media_url}" autoplay playsinline controlsList="nodownload"></video>` : `<img src="${s.media_url}" alt="">`}</div>
      <div class="story-footer"><input type="text" class="story-reply" placeholder="أرسل رداً..." onkeypress="if(event.key==='Enter'){toast('تم إرسال الرد'); this.value='';}"><button class="story-icon" onclick="toast('تم الإعجاب ❤️')">${ico('heart', 22)}</button></div>`;
    $('stClose').onclick = close;
    $('stContent').onclick = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      // RTL: الجانب الأيسر = التالي، الأيمن = السابق
      if (e.clientX < rect.left + rect.width / 2) next(); else prev();
    };
    const fill = document.getElementById(`fill-${idx}`); const dur = s.media_type === 'video' ? 15000 : 5000;
    fill.style.transition = `width ${dur}ms linear`; setTimeout(() => fill.style.width = '100%', 50);
    clearTimeout(timer); timer = setTimeout(next, dur);
  };
  const next = () => { clearTimeout(timer); if (idx < stories.length - 1) { idx++; render(); } else close(); };
  const prev = () => { clearTimeout(timer); if (idx > 0) idx--; render(); };
  render();
}

  drawRooms();
};

async function loadRooms() {
  const { data, error } = await supabaseClient.from('voice_rooms').select('*').order('created_at', { ascending: false }).limit(60);
  if (!$('roomsGrid')) return;
  if (error) { $('roomsGrid').innerHTML = emptyHtml('mic', 'تعذر تحميل الغرف: ' + esc(error.message)); return; }
  roomsCache = data || [];
  const { data: fv } = await supabaseClient.from('room_favorites').select('room_id').eq('user_id', me.id);
  myFavs = new Set((fv || []).map(x => x.room_id));
  const oids = [...new Set(roomsCache.map(r => r.owner_id))];
  if (oids.length) {
    const { data: ps } = await supabaseClient.from('profiles').select('*').in('id', oids);
    ps?.forEach(p => profileCache[p.id] = p);
  }
  drawRooms();
  watchRooms();
}

window.toggleFav = async (roomId) => {
  const was = myFavs.has(roomId);
  const q = supabaseClient.from('room_favorites');
  const { error } = was
    ? await q.delete().eq('user_id', me.id).eq('room_id', roomId)
    : await q.insert({ user_id: me.id, room_id: roomId });
  if (error) return toast('تعذر الحفظ: ' + error.message);
  if (was) myFavs.delete(roomId); else myFavs.add(roomId);
  toast(was ? 'أُزيلت من المفضلة' : 'أُضيفت إلى المفضلة ⭐');
  drawRooms();
};

function drawRooms() {
  const grid = $('roomsGrid'); if (!grid) return;
  const list = roomsCache
    .filter(r => roomFilter === 'fav' ? myFavs.has(r.id) : (roomFilter !== 'premium' || r.is_premium))
    .sort((a, b) => (Number(myFavs.has(b.id)) - Number(myFavs.has(a.id))) || (Number(b.is_premium) - Number(a.is_premium)));
  if (!list.length) {
    grid.innerHTML = emptyHtml('mic', roomFilter === 'fav' ? 'لا توجد غرف في المفضلة بعد.' : roomFilter === 'premium' ? 'لا توجد غرف مميزة الآن.' : 'لا توجد غرف بعد — افتح أول غرفة!');
    return;
  }
  grid.innerHTML = list.map(roomCardHtml).join('');
}

function roomCardHtml(r) {
  const o = profileCache[r.owner_id] || { full_name: 'مستخدم' };
  const mem = roomPresence.get(r.id) || [];
  return `
  <article class="room-card${r.is_premium ? ' premium' : ''}" style="--cover:${coverCss(r)}" onclick="joinRoom('${r.id}')">
    <div class="rc-cover">
      ${r.is_premium ? `<span class="rc-premium">${ico('crown', 13)} مميزة</span>` : '<span></span>'}
      <span class="rc-count"><button class="rc-fav${myFavs.has(r.id) ? ' on' : ''}" onclick="event.stopPropagation();toggleFav('${r.id}')" title="المفضلة">${ico('heart', 15)}</button>${ico('users', 14)} <b id="cnt-${r.id}">${mem.length}</b></span>
    </div>
    <div class="rc-body">
      <h3>${esc(r.title)}${r.is_verified ? ' <span class="verified-badge"></span>' : ''}</h3>
      ${r.description ? `<p>${esc(r.description)}</p>` : ''}
      <div class="rc-foot">
        <div class="rc-host">${avatarHtml({ ...o, id: null })}<span>${esc(o.full_name)}</span></div>
        <div class="rc-stack" id="stack-${r.id}">${stackHtml(mem)}</div>
      </div>
    </div>
  </article>`;
}

// مراقبة عدد المستمعين في الغرف دون الانضمام إليها (presence للقراءة فقط)
function watchRooms() {
  roomsCache.forEach(r => {
    if (roomWatchers.has(r.id)) return;
    // قناة منفصلة عن قناة الغرفة نفسها حتى لا يقطع إغلاقُ المراقب اتصال العضو داخل الغرفة
    const ch = supabaseClient.channel('lobby-room-' + r.id);
    ch.on('presence', { event: 'sync' }, () => {
      roomPresence.set(r.id, collectMembers(ch.presenceState()));
      refreshRoomCard(r.id);
    }).subscribe();
    roomWatchers.set(r.id, ch);
  });
}

window.joinRoom = async (roomId) => {
  if (rv) return;
  let room = roomsCache.find(r => r.id === roomId);
  if (!room) {
    const { data } = await supabaseClient.from('voice_rooms').select('*').eq('id', roomId).maybeSingle();
    room = data;
  }
  if (!room) return toast('الغرفة غير موجودة أو أُغلقت');
  if (!profileCache[room.owner_id]) {
    const { data } = await supabaseClient.from('profiles').select('*').eq('id', room.owner_id).maybeSingle();
    if (data) profileCache[data.id] = data;
  }

  const { data: myMod } = await supabaseClient.from('room_moderation').select('action').eq('room_id', room.id).eq('target_id', me.id);
  if (myMod?.some(r => r.action === 'ban')) return toast('أنت محظور من هذه الغرفة 🚫');
  const forced = !myProtected && !!myMod?.some(r => r.action === 'mute');

  stopRoomWatchers();          // نوقف مراقبة القائمة قبل الانضمام لنفس القناة
  await sleep(250);

  rv = { room, ch: null, pcs: new Map(), audios: new Map(), pending: new Map(), stream: null,
         muted: forced, forcedMute: forced, speaking: false, members: [], vad: null, actx: null, lastTrack: 0, subscribed: false };
  roomChatMsgs = [];
  renderRoomView();
  supabaseClient.from('voice_rooms').select('title, background_key, background_url, music_url, music_started_at').eq('id', room.id).maybeSingle()
    .then(({ data: fresh }) => { if (fresh && rv && rv.room.id === room.id) applyRoomState(fresh); });

  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) { toast('لم يُسمح بالميكروفون — ستدخل كمستمع'); }
  if (!rv || rv.room.id !== room.id) { stream?.getTracks().forEach(t => t.stop()); return; }

  rv.stream = stream;
  if (stream && forced) stream.getAudioTracks().forEach(t => (t.enabled = false));
  if (stream) startVAD();
  rv.iceCfg = await fetchIceConfig();
  connectRoomChannel();
};

function connectRoomChannel() {
  const st = rv;
  const ch = supabaseClient.channel('voice-room-' + st.room.id, { config: { presence: { key: me.id + ':' + SESSION_KEY } } });
  st.ch = ch;
  ch.on('presence', { event: 'sync' }, () => { if (rv === st) onRoomPresence(ch.presenceState()); })
    .on('broadcast', { event: 'sig' }, ({ payload }) => { if (rv === st) onSignal(payload); })
    .on('broadcast', { event: 'closed' }, () => { if (rv === st) { toast('أغلق المالك الغرفة'); leaveRoom(); } })
    .on('broadcast', { event: 'mod' }, ({ payload }) => { if (rv === st) onModEvent(payload); })
    .on('broadcast', { event: 'room' }, ({ payload }) => { if (rv === st && st.room.owner_id !== me.id) applyRoomState(payload); })
    .on('broadcast', { event: 'chat' }, ({ payload }) => { if (rv === st) addRoomChat(payload); })
    .subscribe(status => { if (status === 'SUBSCRIBED' && rv === st) { st.subscribed = true; trackMe(); } });
  st.reconcile = setInterval(() => { if (rv === st && st.subscribed) onRoomPresence(ch.presenceState()); }, 10000);
  st.retrack = setInterval(() => { if (rv === st && st.subscribed) trackMe(); }, 20000);
  // عند عودة التطبيق للمقدمة (بعد قفل الشاشة مثلاً) نعيد إعلان الحضور فوراً
  if (!window.__roomWake) {
    window.__roomWake = true;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && rv?.ch && rv.subscribed) { trackMe(); onRoomPresence(rv.ch.presenceState()); }
    });
  }
}

function trackMe() {
  if (!rv?.ch || !rv.subscribed) return;

function broadcastRoomState() {

    music_url: r.music_url || null, music_started_at: r.music_started_at || null } });
}

function applyRoomState(s) {
  if (!rv || !s) return;
  const r = rv.room;
  if ('title' in s && s.title) r.title = s.title;
  if ('background_key' in s) r.background_key = s.background_key;
  if ('background_url' in s) r.background_url = s.background_url;
  if ('music_url' in s) r.music_url = s.music_url;

function syncRoomMusic() {
  if (!rv) return;
  let a = $('rvMusic');
  if (!a) { a = document.createElement('audio'); a.id = 'rvMusic'; a.preload = 'auto'; document.body.appendChild(a); }
  const r = rv.room;
  if (!r.music_url || !r.music_started_at) { a.pause(); a.removeAttribute('src'); a.dataset.url = ''; return; }
  if (a.dataset.url !== r.music_url) { a.src = r.music_url; a.dataset.url = r.music_url; }
  const start = () => {
    const want = Math.max(0, (Date.now() - Date.parse(r.music_started_at)) / 1000);
    try { a.currentTime = want; } catch (e) {}
    a.play().catch(() => toast('اضغط في أي مكان لتشغيل موسيقى الغرفة'));
  };
  if (a.readyState >= 1) start(); else a.addEventListener('loadedmetadata', start, { once: true });
}

// ---------- Presence & mesh WebRTC ----------
// كل زوج يتصل مرة واحدة: صاحب المعرّف الأصغر هو الذي يبدأ العرض (offer)
async function refreshMemberProfiles(uids) {
  const need = [...new Set(uids.filter(Boolean))];
  if (!need.length) return;
  const { data } = await supabaseClient.from('profiles').select('id, frame, is_verified, avatar_url, full_name').in('id', need);
  (data || []).forEach(p => { profileCache[p.id] = { ...(profileCache[p.id] || {}), ...p }; });
  if (rv) renderRoomView();
}
function onRoomPresence(state) {
  if (!rv) return;
  const now = Date.now();
  const live = collectMembers(state);
  rv.lastSeen = rv.lastSeen || new Map();
  live.forEach(m => rv.lastSeen.set(m.uid, { m, t: now }));
  const liveIds = new Set(live.map(m => m.uid));
  // من يختفي لحظة (انقطاع قصير أو قفل شاشة) يبقى ظاهراً 15 ثانية حتى لا يومض في القائمة
  const ghosts = [];
  for (const [uid, v] of [...rv.lastSeen]) {
    if (liveIds.has(uid)) continue;
    if (now - v.t < 15000) ghosts.push(v.m); else rv.lastSeen.delete(uid);
  }
  rv.members = [...live, ...ghosts];
  refreshMemberProfiles(rv.members.map(m => m.uid));
  if (rv.room.owner_id === me.id) {
    const seen = rv.seen || new Set();
    const fresh = rv.members.some(m => !seen.has(m.uid));
    rv.seen = new Set(rv.members.map(m => m.uid));
    if (fresh) broadcastRoomState();
  }
  const ids = new Set(rv.members.map(m => m.uid));
  rv.gone = rv.gone || {};
  rv.pcs.forEach((_, id) => {
    if (ids.has(id)) { delete rv.gone[id]; return; }
    rv.gone[id] = rv.gone[id] || Date.now();
    if (Date.now() - rv.gone[id] > 12000) { closePeer(id); delete rv.gone[id]; }
  });
  ids.forEach(id => {
    if (id !== me.id && !rv.pcs.has(id) && me.id < id) makeOffer(id);
  });
  renderRoomView();
}

async function makePeer(id, init) {
  const pc = new RTCPeerConnection(rv.iceCfg || RTC_CONFIG);
  rv.pcs.set(id, pc);
  if (rv.stream) rv.stream.getTracks().forEach(t => pc.addTrack(t, rv.stream));
  else if (init) pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.onicecandidate = e => { if (e.candidate) sendSig(id, { candidate: e.candidate }); };
  pc.ontrack = e => attachRemote(id, e.streams[0] || new MediaStream([e.track]));
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'disconnected') {
      setTimeout(() => {
        if (rv && rv.pcs.get(id) === pc && pc.connectionState === 'disconnected') { closePeer(id); if (rv?.ch) onRoomPresence(rv.ch.presenceState()); }
      }, 5000);
    }
    if (pc.connectionState === 'failed') {
      closePeer(id);
      setTimeout(() => { if (rv?.ch) onRoomPresence(rv.ch.presenceState()); }, 2500);
    }
  };
  return pc;
}

async function makeOffer(id) {
  try {
    const pc = await makePeer(id, true);
    await pc.setLocalDescription(await pc.createOffer());
    sendSig(id, { sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
  } catch (e) { console.warn('offer', e); closePeer(id); }
}

function sendSig(to, body) {
  if (!rv?.ch) return;
  rv.ch.send({ type: 'broadcast', event: 'sig', payload: { to, from: me.id, ...body } });
}

async function onSignal(p) {
  if (!rv || p.to !== me.id) return;
  const id = p.from;
  try {
    if (p.sdp?.type === 'offer') {
      closePeer(id);
      const pc = await makePeer(id, false);
      await pc.setRemoteDescription(p.sdp);
      await flushIce(id);
      await pc.setLocalDescription(await pc.createAnswer());
      sendSig(id, { sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
    } else if (p.sdp?.type === 'answer') {
      const pc = rv.pcs.get(id);
      if (pc) { await pc.setRemoteDescription(p.sdp); await flushIce(id); }
    } else if (p.candidate) {
      const pc = rv.pcs.get(id);
      if (pc?.remoteDescription) await pc.addIceCandidate(p.candidate).catch(() => {});
      else {
        if (!rv.pending.has(id)) rv.pending.set(id, []);
        rv.pending.get(id).push(p.candidate);
      }
    }
  } catch (e) { console.warn('signal', e); }
}

async function flushIce(id) {
  const pc = rv?.pcs.get(id);
  const list = rv?.pending.get(id) || [];
  rv?.pending.delete(id);
  if (pc) for (const c of list) await pc.addIceCandidate(c).catch(() => {});
}

function attachRemote(id, stream) {
  if (!rv) return;
  let a = rv.audios.get(id);
  if (!a) {
    a = document.createElement('audio');
    a.autoplay = true; a.playsInline = true; a.style.display = 'none';
    document.body.appendChild(a);
    rv.audios.set(id, a);
  }
  a.srcObject = stream;
  a.play().catch(() => {});
}

function closePeer(id) {
  if (!rv) return;
  const pc = rv.pcs.get(id);
  if (pc) { pc.onconnectionstatechange = null; pc.close(); }
  rv.pcs.delete(id);
  rv.pending.delete(id);
  const a = rv.audios.get(id);
  if (a) { a.srcObject = null; a.remove(); }
  rv.audios.delete(id);
}

// ---------- Speaking detection & mic ----------
function startVAD() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    rv.actx = new Ctx();
    rv.actx.resume?.();
    const an = rv.actx.createAnalyser();
    an.fftSize = 512;
    rv.actx.createMediaStreamSource(rv.stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    rv.vad = setInterval(() => {
      if (!rv) return;
      an.getByteTimeDomainData(buf);
      let s = 0;
      for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; s += x * x; }
      const talking = !rv.muted && Math.sqrt(s / buf.length) > 0.035;
      if (talking !== rv.speaking && Date.now() - rv.lastTrack > 350) {
        rv.speaking = talking;
        trackMe();
        renderRoomView();
      }
    }, 120);
  } catch (e) { console.warn('VAD', e); }
}

window.toggleRoomMic = () => {
  if (!rv?.stream) return;

  rv.muted = !rv.muted;
  rv.stream.getAudioTracks().forEach(t => (t.enabled = !rv.muted));
  if (rv.muted) rv.speaking = false;
  trackMe();
  renderRoomView();
};

function onModEvent(p) {
  if (!rv || p.to !== me.id || p.from !== rv.room.owner_id) return;
  if (myProtected && (p.type === 'kick' || p.type === 'mute')) return;
  if (p.type === 'kick') { toast('تم طردك من الغرفة'); leaveRoom(); return; }
  if (p.type === 'mute') { rv.forcedMute = true; applyMute(true); toast('كتمك صاحب الغرفة 🔇'); }
  if (p.type === 'unmute') { rv.forcedMute = false; applyMute(false); toast('تم رفع الكتم عنك'); }
}

function applyMute(on) {
  if (!rv) return;

window.openModerate = async (uid) => {
  if (!rv || rv.room.owner_id !== me.id || uid === me.id) return;
  const m = rv.members.find(x => x.uid === uid);
  if (!m) return;
  const { data: isProtected, error } = await supabaseClient.rpc('is_protected_user', { p_uid: uid });
  if (error) return toast('تعذر التحقق: ' + error.message);
  const { data: rows } = await supabaseClient.from('room_moderation')
    .select('action').eq('room_id', rv.room.id).eq('target_id', uid);
  const muted = !!rows?.some(r => r.action === 'mute');
  showRoomSheet(`
    <div class="mod-head">
      <div class="avatar">${avatarInner(m)}</div>
      <div><b>${esc(m.name)}</b><span>إجراءات المشرف</span></div>

    <button class="mod-act" onclick="modAct('kick','${uid}')">${ico('x', 20)} طرد من الغرفة</button>
    <button class="mod-act danger" onclick="modAct('ban','${uid}')">${ico('shield', 20)} حظر من الغرفة</button>`);
};

window.modAct = async (action, uid) => {
  if (!rv || rv.room.owner_id !== me.id) return;
  const roomId = rv.room.id;
  const name = rv.members.find(x => x.uid === uid)?.name || 'المستخدم';
  try {
    if (action === 'kick' || action === 'ban' || action === 'mute') {
      const { data: isProtected, error: pErr } = await supabaseClient.rpc('is_protected_user', { p_uid: uid });
      if (pErr) throw pErr;
      if (isProtected) return showProtectedNotice(action);
    }
    if (action === 'kick') {
      sendMod(uid, 'kick');
      toast(`تم طرد ${name}`);
    } else if (action === 'ban' || action === 'mute') {
      const { error } = await supabaseClient.from('room_moderation').upsert(
        { room_id: roomId, target_id: uid, action, created_by: me.id },
        { onConflict: 'room_id,target_id,action', ignoreDuplicates: true });
      if (error) throw error;
      sendMod(uid, action === 'ban' ? 'kick' : 'mute');
      toast(action === 'ban' ? `تم حظر ${name}` : `تم كتم ${name}`);
    } else if (action === 'unmute') {
      const { error } = await supabaseClient.from('room_moderation').delete()
        .eq('room_id', roomId).eq('target_id', uid).eq('action', 'mute');
      if (error) throw error;
      sendMod(uid, 'unmute');
      toast('تم إلغاء الكتم');
    } else if (action === 'unban') {
      const { error } = await supabaseClient.from('room_moderation').delete()
        .eq('room_id', roomId).eq('target_id', uid).eq('action', 'ban');
      if (error) throw error;
      toast('تم رفع الحظر');
    }
  } catch (e) {
    if (String(e.message || '').includes('PROTECTED_USER')) return showProtectedNotice(action);
    return toast('تعذر تنفيذ الإجراء: ' + e.message);
  }
  if (action === 'unban') return openBanList();
  closeRoomSheet();
};

window.openBanList = async () => {
  if (!rv || rv.room.owner_id !== me.id) return;
  const { data: rows, error } = await supabaseClient.from('room_moderation')
    .select('target_id').eq('room_id', rv.room.id).eq('action', 'ban');
  if (error) return toast('تعذر تحميل القائمة: ' + error.message);
  const ids = (rows || []).map(r => r.target_id);
  let profs = [];
  if (ids.length) {
    const { data } = await supabaseClient.from('profiles').select('*').in('id', ids);
    profs = data || [];
    profs.forEach(p => profileCache[p.id] = p);

  showRoomSheet(`
    <div class="mod-head"><div><b>المحظورون</b><span>${ids.length} مستخدم</span></div></div>
    ${ids.length
      ? profs.map(p => `

};

const PUSH_SUPPORTED = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let swReg = null;

function urlB64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
const withTimeout = (p, ms = 4000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function getReg() { return swReg || await withTimeout(navigator.serviceWorker.ready); }

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(e => console.warn('SW:', e));
  navigator.serviceWorker.addEventListener('message', e => {
    const m = e.data || {};
    if (m.type === 'push-nav') handlePushNav(m.data);
    if (m.type === 'push-received') {
      playNotifySound();
      const d = m.data || {};
      if (d.type === 'message' && d.from === currentChatUser) return; // المحادثة مفتوحة أمامك
      toast(`${m.title}: ${m.body}`);

    }

}

function handlePushNav(d) {

}

async function syncSubscription(sub) {
  const j = sub.toJSON();
  const { error } = await supabaseClient.rpc('register_push', {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent.slice(0, 200)
  });
  if (error) throw error;
}
async function subscribeNow() {
  const reg = await getReg();
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY) });
  await syncSubscription(sub);
}

  $('btnEnablePush').onclick = enablePush;

  if (!PUSH_SUPPORTED) {
    // iPhone/iPad: الإشعارات تعمل فقط بعد إضافة الموقع للشاشة الرئيسية
    if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !dismissed) {

      $('btnEnablePush').classList.add('hidden');

      if (sub) await supabaseClient.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
    }
  } catch (e) { /* نتجاهل ونكمل الخروج */ }
  await supabaseClient.auth.signOut();
}

document.addEventListener('contextmenu', e => { if (e.target.tagName === 'VIDEO' || e.target.tagName === 'IMG') e.preventDefault(); });
</script>
</body>
