<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASL">
<title>WASL — وَصْل | تواصل أقرب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ============================================================
   WASL — AURORA v2  (تصميم جديد · نفس قاعدة البيانات)
   ============================================================ */
:root{
  --bg:#07070d;
  --bg-2:#0d0d18;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.075);
  --surface-solid:#12121e;
  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.15);
  --text:#f6f6fb;
  --muted:#8d90a8;
  --primary:#8b5cf6;
  --primary-2:#a78bfa;
  --accent:#ec4899;
  --cyan:#22d3ee;
  --ok:#22c55e;
  --danger:#f43f5e;
  --grad:linear-gradient(135deg,#7c3aed 0%,#c026d3 55%,#ec4899 100%);
  --grad-soft:linear-gradient(135deg,rgba(124,58,237,.22),rgba(236,72,153,.14));
  --grad-ring:conic-gradient(from 210deg,#ec4899,#8b5cf6,#22d3ee,#ec4899);
  --glow:0 8px 32px rgba(139,92,246,.35);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:'Cairo',system-ui,sans-serif; line-height:1.65;
  min-height:100vh; overflow-x:hidden; padding-bottom:120px;
}
/* aurora background */
body::before,body::after{
  content:''; position:fixed; z-index:-1; border-radius:50%; filter:blur(90px); pointer-events:none; opacity:.55;
}
body::before{width:520px;height:520px;top:-160px;right:-120px;background:radial-gradient(circle,#7c3aed,transparent 70%);animation:float1 18s ease-in-out infinite alternate}
body::after{width:560px;height:560px;bottom:-200px;left:-160px;background:radial-gradient(circle,#db2777,transparent 70%);animation:float2 22s ease-in-out infinite alternate;opacity:.4}
@keyframes float1{to{transform:translate(-120px,140px) scale(1.15)}}
@keyframes float2{to{transform:translate(160px,-120px) scale(1.1)}}

button,input,textarea{font-family:inherit;outline:none;color:inherit}
button{border:none;cursor:pointer;background:none;transition:all .22s var(--ease)}
button:active{transform:scale(.95)}
svg{display:block;flex-shrink:0}
i[data-ico]{display:inline-grid;place-items:center;font-style:normal}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

.loader{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--primary);animation:rot .8s linear infinite;margin:30px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px;color:var(--muted);text-align:center;font-size:14px}
.empty .e-ico{width:64px;height:64px;border-radius:22px;background:var(--grad-soft);border:1px solid var(--border);display:grid;place-items:center;color:var(--primary-2)}
.fade-in{animation:fadeIn .4s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ================= AUTH ================= */
.auth-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:var(--bg);overflow-y:auto}
.auth-box{width:100%;max-width:420px;padding:38px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--border-2);border-radius:32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(30px);animation:fadeIn .6s var(--ease)}
.logo-mark{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:var(--glow);transform:rotate(-6deg)}
.auth-box h1{font-size:34px;font-weight:900;letter-spacing:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.auth-box .tag{margin:6px 0 22px;color:var(--muted);font-size:14px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--border);margin-bottom:20px}
.auth-tab{padding:10px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.auth-tab.active{background:var(--surface-2);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.input-group{margin-bottom:14px;position:relative}
.input-group input{width:100%;padding:15px 18px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--border);font-size:15px;transition:.2s}
.input-group input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.input-group input::placeholder{color:#6b6e86}
.btn-primary{width:100%;padding:14px;border-radius:16px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;box-shadow:var(--glow);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:wait}

/* ================= HEADER ================= */
.app-header{position:sticky;top:0;z-index:50;padding:10px 16px;background:linear-gradient(180deg,rgba(7,7,13,.92),rgba(7,7,13,.6));backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid var(--border)}
.header-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:1.5px;cursor:pointer;user-select:none}
.brand-icon{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:20px;box-shadow:var(--glow);transform:rotate(-6deg)}
.brand-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.search-pill{flex:1;max-width:420px;margin-inline:auto;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:30px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:14px;text-align:start}
.search-pill:hover{border-color:var(--primary);background:var(--surface-2)}
.header-actions{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.search-pill + .header-actions{margin-inline-start:0}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--surface-2);border-color:var(--primary);color:var(--primary-2)}
.icon-btn.search-only{display:none}
.notif-dot{position:absolute;top:9px;right:10px;width:10px;height:10px;background:var(--accent);border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 10px var(--accent)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#22d3ee);color:#fff;font-size:10px;font-weight:900;box-shadow:0 0 10px rgba(59,130,246,.55);margin-inline:4px;vertical-align:middle}
.verified-badge::after{content:'✓'}

/* ================= LAYOUT ================= */
.layout{max-width:1240px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:22px;align-items:start}
.sidebar,.right-panel{position:sticky;top:86px}
.glass-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:18px;backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.side-user{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid var(--border);cursor:pointer}
.side-user .avatar{width:48px;height:48px}
.side-user strong{display:block;font-size:15px;line-height:1.3}
.side-user span{font-size:12px;color:var(--muted)}
.nav-wrap{padding:10px}
.nav-btn{width:100%;display:flex;align-items:center;gap:13px;padding:12px 14px;color:var(--muted);font-weight:700;font-size:15px;border-radius:15px;cursor:pointer;position:relative;text-align:start}
.nav-btn:hover{background:var(--surface);color:#fff}
.nav-btn.active{background:var(--grad-soft);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.nav-btn.active i{color:var(--primary-2)}
.nav-btn.active::after{content:'';position:absolute;inset-inline-start:-10px;top:22%;bottom:22%;width:4px;border-radius:4px;background:var(--grad)}
.nav-sep{height:1px;background:var(--border);margin:8px 6px}
.nav-btn.danger:hover{color:var(--danger);background:rgba(244,63,94,.08)}

/* ================= STORIES ================= */
.stories-card{padding:16px 6px 12px}
.stories-wrapper{padding:2px 14px;overflow-x:auto;display:flex;gap:14px}
.stories-wrapper::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:74px;cursor:pointer}
.story-ring{width:70px;height:70px;border-radius:50%;padding:3px;background:var(--grad-ring);transition:transform .25s var(--ease)}
.story-item:hover .story-ring{transform:scale(1.07) rotate(6deg)}
.story-ring .avatar{width:100%;height:100%;border:3px solid var(--bg)}
.story-ring.add{background:transparent;border:2px dashed rgba(139,92,246,.7);padding:4px}
.story-ring.add .avatar{border:none;background:var(--grad-soft);color:var(--primary-2)}
.story-name{font-size:12px;color:#d6d8ea;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

/* story viewer */
.story-viewer{position:fixed;inset:0;z-index:100002;background:#000;display:flex;flex-direction:column;pointer-events:auto;animation:fadeIn .25s}
.story-progress{display:flex;gap:5px;padding:14px 14px 8px;position:relative;z-index:3}
.p-bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.p-fill{height:100%;background:#fff;border-radius:3px}
.story-header{display:flex;align-items:center;gap:10px;padding:6px 14px 12px;position:relative;z-index:3;color:#fff}
.story-header .avatar{width:38px;height:38px}
.story-content{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.story-content img,.story-content video{max-width:100%;max-height:100%;object-fit:contain}
.story-footer{display:flex;gap:10px;padding:14px;align-items:center;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
.story-reply{flex:1;padding:12px 18px;border-radius:26px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff}
.story-reply::placeholder{color:#cbd}
.story-icon{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px}

/* ================= COMPOSER & POSTS ================= */
.composer{padding:18px}
.composer-top{display:flex;gap:12px}
.composer textarea{flex:1;min-height:58px;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:18px;padding:14px 16px;resize:none;font-size:15px;transition:.2s}
.composer textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.14)}
.composer textarea::placeholder{color:#6b6e86}
.composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.pill-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:30px;background:var(--surface);border:1px solid var(--border);color:#d6d8ea;font-weight:700;font-size:14px;cursor:pointer}
.pill-btn:hover{border-color:var(--primary);color:#fff;background:var(--surface-2)}
.pill-btn i{color:var(--primary-2)}
.composer .btn-primary{width:auto;padding:9px 28px;font-size:15px;border-radius:30px}
.media-preview{margin-top:12px;position:relative;display:inline-block}
.media-preview img,.media-preview video{max-height:220px;max-width:100%;border-radius:16px;border:1px solid var(--border)}
.media-preview .x{position:absolute;top:8px;inset-inline-start:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff}

.post-card{padding:18px;transition:border-color .25s}
.post-card:hover{border-color:var(--border-2)}
.post-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.post-header .avatar{width:46px;height:46px}
.post-author{cursor:pointer;line-height:1.35}
.post-author .nm{font-weight:800;font-size:15px}
.post-menu{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.post-menu:hover{background:var(--surface-2);color:#fff}
.post-text{margin:8px 0 12px;font-size:15.5px;white-space:pre-wrap;word-break:break-word}
.post-media{width:100%;border-radius:20px;border:1px solid var(--border);max-height:560px;object-fit:cover;background:#000;display:block}
.post-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.action-btn{flex:1;padding:10px;border-radius:14px;color:var(--muted);font-weight:700;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer}
.action-btn:hover{background:var(--surface-2);color:#fff}
.action-btn.liked{color:var(--accent);background:rgba(236,72,153,.1)}
.action-btn.liked svg{fill:var(--accent)}

/* ================= PROFILE ================= */
.tp-container{border-radius:var(--r-lg);overflow:hidden;position:relative;margin-bottom:20px;border:1px solid var(--border);background:var(--surface)}
.tp-cover{height:190px;background:linear-gradient(135deg,#2a1a52,#5b1f5e);background-size:cover;background-position:center;position:relative}
.tp-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(7,7,13,.75))}
.tp-cover.editable{cursor:pointer}
.tp-cover.editable:hover .cover-hint{opacity:1}
.cover-hint{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;opacity:0;transition:.25s;z-index:2}
.tp-top-actions{position:absolute;top:14px;inset-inline-start:14px;z-index:5}
.tp-icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15)}
.tp-avatar-wrap{position:absolute;bottom:-52px;inset-inline-end:22px;width:108px;height:108px;border-radius:50%;padding:4px;background:var(--grad-ring);z-index:6}
.tp-avatar-wrap .in{width:100%;height:100%;border-radius:50%;overflow:hidden;border:4px solid var(--bg);background:var(--surface-solid);position:relative}
.tp-avatar-wrap.editable{cursor:pointer}
.tp-avatar-wrap.editable:hover .in::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5)}
.tp-avatar-wrap img{width:100%;height:100%;object-fit:cover}
.tp-avatar-wrap .ph{width:100%;height:100%;display:grid;place-items:center;font-size:38px;font-weight:900;background:var(--grad)}
.tp-info-section{padding:62px 22px 22px;text-align:start}
.tp-name{font-size:23px;font-weight:900;display:flex;align-items:center;gap:4px}
.tp-handle{color:var(--muted);font-size:14px;margin-bottom:14px}
.tp-bio{font-size:14.5px;color:#dcdeef;margin-bottom:18px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--border)}
.tp-bio.me{cursor:pointer}
.tp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tp-stat-item{padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:center}
.tp-stat-num{display:block;font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.tp-stat-label{font-size:12px;color:var(--muted)}
.tp-action-row{display:flex;gap:10px}
.tp-action-btn{flex:1;padding:12px;border-radius:14px;font-weight:800;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border)}
.tp-action-btn:hover{border-color:var(--primary)}
.tp-action-btn.main{background:var(--grad);border:none;box-shadow:var(--glow)}
.tp-action-btn:disabled{opacity:.55;cursor:default}
.tp-tabs{display:flex;align-items:center;gap:8px;padding:14px 22px;border-top:1px solid var(--border);font-weight:800;color:#fff}
.tp-tabs i{color:var(--primary-2)}
.tp-tabs span{margin-inline-start:auto;color:var(--muted);font-weight:600;font-size:13px}
.tp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px 3px}
.tp-grid-item{aspect-ratio:1;position:relative;background:var(--surface);overflow:hidden;cursor:pointer;border-radius:6px}
.tp-grid-item img,.tp-grid-item video{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.tp-grid-item:hover img,.tp-grid-item:hover video{transform:scale(1.08)}
.tp-grid-text{padding:12px;font-size:12.5px;display:flex;align-items:center;justify-content:center;text-align:center;height:100%;background:var(--grad-soft);word-break:break-word}
.tp-grid-vid{position:absolute;top:8px;inset-inline-start:8px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}

/* ================= CHAT ================= */
.chat-container{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 130px);min-height:480px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(18px)}
.chat-sidebar{border-inline-end:1px solid var(--border);overflow:hidden;background:rgba(0,0,0,.2);display:flex;flex-direction:column;min-height:0}
.chat-header-top{padding:18px 16px 12px}
.chat-header-top h2{font-size:22px;font-weight:900;margin-bottom:12px}
.chat-search{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--muted)}
.chat-search input{flex:1;background:none;border:none;font-size:14px;min-width:0}
.chat-list-inner{flex:1;overflow-y:auto;padding:4px 8px 10px}
.chat-person{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;cursor:pointer;margin-bottom:2px;transition:.2s}
.chat-person:hover{background:var(--surface)}
.chat-person.active{background:var(--grad-soft);box-shadow:inset 0 0 0 1px rgba(139,92,246,.3)}
.chat-person .avatar{width:48px;height:48px}
.chat-person-info{flex:1;min-width:0}
.chat-person-name{font-weight:800;font-size:15px;line-height:1.35}
.chat-person-msg{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chat-window{display:flex;flex-direction:column;min-width:0;min-height:0;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.22);min-height:68px}
.chat-header .avatar{width:44px;height:44px}
.chat-header-info{cursor:pointer;lin
