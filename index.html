<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASL">
<title>WASL — وَصْل | تواصل أقرب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ============================================================
   WASL — AURORA v2  (تصميم جديد · نفس قاعدة البيانات)
   ============================================================ */
:root{
  --bg:#07070d;
  --bg-2:#0d0d18;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.075);
  --surface-solid:#12121e;
  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.15);
  --text:#f6f6fb;
  --muted:#8d90a8;
  --primary:#8b5cf6;
  --primary-2:#a78bfa;
  --accent:#ec4899;
  --cyan:#22d3ee;
  --ok:#22c55e;
  --danger:#f43f5e;
  --grad:linear-gradient(135deg,#7c3aed 0%,#c026d3 55%,#ec4899 100%);
  --grad-soft:linear-gradient(135deg,rgba(124,58,237,.22),rgba(236,72,153,.14));
  --grad-ring:conic-gradient(from 210deg,#ec4899,#8b5cf6,#22d3ee,#ec4899);
  --glow:0 8px 32px rgba(139,92,246,.35);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:'Cairo',system-ui,sans-serif; line-height:1.65;
  min-height:100vh; overflow-x:hidden; padding-bottom:120px;
}
/* aurora background */
body::before,body::after{
  content:''; position:fixed; z-index:-1; border-radius:50%; filter:blur(90px); pointer-events:none; opacity:.55;
}
body::before{width:520px;height:520px;top:-160px;right:-120px;background:radial-gradient(circle,#7c3aed,transparent 70%);animation:float1 18s ease-in-out infinite alternate}
body::after{width:560px;height:560px;bottom:-200px;left:-160px;background:radial-gradient(circle,#db2777,transparent 70%);animation:float2 22s ease-in-out infinite alternate;opacity:.4}
@keyframes float1{to{transform:translate(-120px,140px) scale(1.15)}}
@keyframes float2{to{transform:translate(160px,-120px) scale(1.1)}}

button,input,textarea{font-family:inherit;outline:none;color:inherit}
button{border:none;cursor:pointer;background:none;transition:all .22s var(--ease)}
button:active{transform:scale(.95)}
svg{display:block;flex-shrink:0}
i[data-ico]{display:inline-grid;place-items:center;font-style:normal}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

.loader{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--primary);animation:rot .8s linear infinite;margin:30px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px;color:var(--muted);text-align:center;font-size:14px}
.empty .e-ico{width:64px;height:64px;border-radius:22px;background:var(--grad-soft);border:1px solid var(--border);display:grid;place-items:center;color:var(--primary-2)}
.fade-in{animation:fadeIn .4s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ================= AUTH ================= */
.auth-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:var(--bg);overflow-y:auto}
.auth-box{width:100%;max-width:420px;padding:38px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--border-2);border-radius:32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(30px);animation:fadeIn .6s var(--ease)}
.logo-mark{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:var(--glow);transform:rotate(-6deg)}
.auth-box h1{font-size:34px;font-weight:900;letter-spacing:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.auth-box .tag{margin:6px 0 22px;color:var(--muted);font-size:14px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--border);margin-bottom:20px}
.auth-tab{padding:10px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.auth-tab.active{background:var(--surface-2);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.input-group{margin-bottom:14px;position:relative}
.input-group input{width:100%;padding:15px 18px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--border);font-size:15px;transition:.2s}
.input-group input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.input-group input::placeholder{color:#6b6e86}
.btn-primary{width:100%;padding:14px;border-radius:16px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;box-shadow:var(--glow);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:wait}

/* ================= HEADER ================= */
.app-header{position:sticky;top:0;z-index:50;padding:10px 16px;background:linear-gradient(180deg,rgba(7,7,13,.92),rgba(7,7,13,.6));backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid var(--border)}
.header-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:1.5px;cursor:pointer;user-select:none}
.brand-icon{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:20px;box-shadow:var(--glow);transform:rotate(-6deg)}
.brand-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.search-pill{flex:1;max-width:420px;margin-inline:auto;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:30px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:14px;text-align:start}
.search-pill:hover{border-color:var(--primary);background:var(--surface-2)}
.header-actions{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.search-pill + .header-actions{margin-inline-start:0}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--surface-2);border-color:var(--primary);color:var(--primary-2)}
.icon-btn.search-only{display:none}
.notif-dot{position:absolute;top:9px;right:10px;width:10px;height:10px;background:var(--accent);border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 10px var(--accent)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#22d3ee);color:#fff;font-size:10px;font-weight:900;box-shadow:0 0 10px rgba(59,130,246,.55);margin-inline:4px;vertical-align:middle}
.verified-badge::after{content:'✓'}

/* ================= LAYOUT ================= */
.layout{max-width:1240px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:22px;align-items:start}
.sidebar,.right-panel{position:sticky;top:86px}
.glass-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:18px;backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.side-user{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid var(--border);cursor:pointer}
.side-user .avatar{width:48px;height:48px}
.side-user strong{display:block;font-size:15px;line-height:1.3}
.side-user span{font-size:12px;color:var(--muted)}
.nav-wrap{padding:10px}
.nav-btn{width:100%;display:flex;align-items:center;gap:13px;padding:12px 14px;color:var(--muted);font-weight:700;font-size:15px;border-radius:15px;cursor:pointer;position:relative;text-align:start}
.nav-btn:hover{background:var(--surface);color:#fff}
.nav-btn.active{background:var(--grad-soft);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.nav-btn.active i{color:var(--primary-2)}
.nav-btn.active::after{content:'';position:absolute;inset-inline-start:-10px;top:22%;bottom:22%;width:4px;border-radius:4px;background:var(--grad)}
.nav-sep{height:1px;background:var(--border);margin:8px 6px}
.nav-btn.danger:hover{color:var(--danger);background:rgba(244,63,94,.08)}

/* ================= STORIES ================= */
.stories-card{padding:16px 6px 12px}
.stories-wrapper{padding:2px 14px;overflow-x:auto;display:flex;gap:14px}
.stories-wrapper::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:74px;cursor:pointer}
.story-ring{width:70px;height:70px;border-radius:50%;padding:3px;background:var(--grad-ring);transition:transform .25s var(--ease)}
.story-item:hover .story-ring{transform:scale(1.07) rotate(6deg)}
.story-ring .avatar{width:100%;height:100%;border:3px solid var(--bg)}
.story-ring.add{background:transparent;border:2px dashed rgba(139,92,246,.7);padding:4px}
.story-ring.add .avatar{border:none;background:var(--grad-soft);color:var(--primary-2)}
.story-name{font-size:12px;color:#d6d8ea;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

/* story viewer */
.story-viewer{position:fixed;inset:0;z-index:100002;background:#000;display:flex;flex-direction:column;pointer-events:auto;animation:fadeIn .25s}
.story-progress{display:flex;gap:5px;padding:14px 14px 8px;position:relative;z-index:3}
.p-bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.p-fill{height:100%;background:#fff;border-radius:3px}
.story-header{display:flex;align-items:center;gap:10px;padding:6px 14px 12px;position:relative;z-index:3;color:#fff}
.story-header .avatar{width:38px;height:38px}
.story-content{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.story-content img,.story-content video{max-width:100%;max-height:100%;object-fit:contain}
.story-footer{display:flex;gap:10px;padding:14px;align-items:center;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
.story-reply{flex:1;padding:12px 18px;border-radius:26px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff}
.story-reply::placeholder{color:#cbd}
.story-icon{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px}

/* ================= COMPOSER & POSTS ================= */
.composer{padding:18px}
.composer-top{display:flex;gap:12px}
.composer textarea{flex:1;min-height:58px;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:18px;padding:14px 16px;resize:none;font-size:15px;transition:.2s}
.composer textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.14)}
.composer textarea::placeholder{color:#6b6e86}
.composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.pill-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:30px;background:var(--surface);border:1px solid var(--border);color:#d6d8ea;font-weight:700;font-size:14px;cursor:pointer}
.pill-btn:hover{border-color:var(--primary);color:#fff;background:var(--surface-2)}
.pill-btn i{color:var(--primary-2)}
.composer .btn-primary{width:auto;padding:9px 28px;font-size:15px;border-radius:30px}
.media-preview{margin-top:12px;position:relative;display:inline-block}
.media-preview img,.media-preview video{max-height:220px;max-width:100%;border-radius:16px;border:1px solid var(--border)}
.media-preview .x{position:absolute;top:8px;inset-inline-start:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff}

.post-card{padding:18px;transition:border-color .25s}
.post-card:hover{border-color:var(--border-2)}
.post-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.post-header .avatar{width:46px;height:46px}
.post-author{cursor:pointer;line-height:1.35}
.post-author .nm{font-weight:800;font-size:15px}
.post-menu{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.post-menu:hover{background:var(--surface-2);color:#fff}
.post-text{margin:8px 0 12px;font-size:15.5px;white-space:pre-wrap;word-break:break-word}
.post-media{width:100%;border-radius:20px;border:1px solid var(--border);max-height:560px;object-fit:cover;background:#000;display:block}
.post-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.action-btn{flex:1;padding:10px;border-radius:14px;color:var(--muted);font-weight:700;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer}
.action-btn:hover{background:var(--surface-2);color:#fff}
.action-btn.liked{color:var(--accent);background:rgba(236,72,153,.1)}
.action-btn.liked svg{fill:var(--accent)}

/* ================= PROFILE ================= */
.tp-container{border-radius:var(--r-lg);overflow:hidden;position:relative;margin-bottom:20px;border:1px solid var(--border);background:var(--surface)}
.tp-cover{height:190px;background:linear-gradient(135deg,#2a1a52,#5b1f5e);background-size:cover;background-position:center;position:relative}
.tp-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(7,7,13,.75))}
.tp-cover.editable{cursor:pointer}
.tp-cover.editable:hover .cover-hint{opacity:1}
.cover-hint{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;opacity:0;transition:.25s;z-index:2}
.tp-top-actions{position:absolute;top:14px;inset-inline-start:14px;z-index:5}
.tp-icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15)}
.tp-avatar-wrap{position:absolute;bottom:-52px;inset-inline-end:22px;width:108px;height:108px;border-radius:50%;padding:4px;background:var(--grad-ring);z-index:6}
.tp-avatar-wrap .in{width:100%;height:100%;border-radius:50%;overflow:hidden;border:4px solid var(--bg);background:var(--surface-solid);position:relative}
.tp-avatar-wrap.editable{cursor:pointer}
.tp-avatar-wrap.editable:hover .in::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5)}
.tp-avatar-wrap img{width:100%;height:100%;object-fit:cover}
.tp-avatar-wrap .ph{width:100%;height:100%;display:grid;place-items:center;font-size:38px;font-weight:900;background:var(--grad)}
.tp-info-section{padding:62px 22px 22px;text-align:start}
.tp-name{font-size:23px;font-weight:900;display:flex;align-items:center;gap:4px}
.tp-handle{color:var(--muted);font-size:14px;margin-bottom:14px}
.tp-bio{font-size:14.5px;color:#dcdeef;margin-bottom:18px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--border)}
.tp-bio.me{cursor:pointer}
.tp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tp-stat-item{padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:center}
.tp-stat-num{display:block;font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.tp-stat-label{font-size:12px;color:var(--muted)}
.tp-action-row{display:flex;gap:10px}
.tp-action-btn{flex:1;padding:12px;border-radius:14px;font-weight:800;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border)}
.tp-action-btn:hover{border-color:var(--primary)}
.tp-action-btn.main{background:var(--grad);border:none;box-shadow:var(--glow)}
.tp-action-btn:disabled{opacity:.55;cursor:default}
.tp-tabs{display:flex;align-items:center;gap:8px;padding:14px 22px;border-top:1px solid var(--border);font-weight:800;color:#fff}
.tp-tabs i{color:var(--primary-2)}
.tp-tabs span{margin-inline-start:auto;color:var(--muted);font-weight:600;font-size:13px}
.tp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px 3px}
.tp-grid-item{aspect-ratio:1;position:relative;background:var(--surface);overflow:hidden;cursor:pointer;border-radius:6px}
.tp-grid-item img,.tp-grid-item video{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.tp-grid-item:hover img,.tp-grid-item:hover video{transform:scale(1.08)}
.tp-grid-text{padding:12px;font-size:12.5px;display:flex;align-items:center;justify-content:center;text-align:center;height:100%;background:var(--grad-soft);word-break:break-word}
.tp-grid-vid{position:absolute;top:8px;inset-inline-start:8px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}

/* ================= CHAT ================= */
.chat-container{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 130px);min-height:480px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(18px)}
.chat-sidebar{border-inline-end:1px solid var(--border);overflow:hidden;background:rgba(0,0,0,.2);display:flex;flex-direction:column;min-height:0}
.chat-header-top{padding:18px 16px 12px}
.chat-header-top h2{font-size:22px;font-weight:900;margin-bottom:12px}
.chat-search{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--muted)}
.chat-search input{flex:1;background:none;border:none;font-size:14px;min-width:0}
.chat-list-inner{flex:1;overflow-y:auto;padding:4px 8px 10px}
.chat-person{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;cursor:pointer;margin-bottom:2px;transition:.2s}
.chat-person:hover{background:var(--surface)}
.chat-person.active{background:var(--grad-soft);box-shadow:inset 0 0 0 1px rgba(139,92,246,.3)}
.chat-person .avatar{width:48px;height:48px}
.chat-person-info{flex:1;min-width:0}
.chat-person-name{font-weight:800;font-size:15px;line-height:1.35}
.chat-person-msg{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chat-window{display:flex;flex-direction:column;min-width:0;min-height:0;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.22);min-height:68px}
.chat-header .avatar{width:44px;height:44px}
.chat-header-info{cursor:pointer;line-height:1.35}
.chat-header-info .name{font-size:16px;font-weight:800}
.chat-header-info .status{font-size:12px;color:var(--muted)}
.chat-header-actions{display:flex;gap:8px;margin-inline-start:auto}
.chat-header-actions button{color:var(--primary-2);background:rgba(139,92,246,.12);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid rgba(139,92,246,.25)}
.chat-header-actions button:hover{background:var(--primary);color:#fff}
.chat-placeholder{flex:1;display:flex;align-items:center;justify-content:center}
.back-btn-chat{display:none;width:40px;height:40px;border-radius:14px;background:var(--surface-2);place-items:center}

.chat-messages{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg-bubble{max-width:76%;padding:10px 15px;border-radius:20px;font-size:14.5px;line-height:1.55;position:relative;word-wrap:break-word;animation:fadeIn .25s}
.msg-bubble.them{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-end-start-radius:6px}
.msg-bubble.me{align-self:flex-end;background:var(--grad);border-end-end-radius:6px;box-shadow:0 6px 20px rgba(168,50,220,.3)}
.msg-time{font-size:10px;opacity:.65;margin-top:2px;display:block;text-align:end}
.msg-bubble audio{width:100%;min-width:200px;max-width:240px;height:38px;margin-top:2px}

.quick-replies{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.quick-replies::-webkit-scrollbar{display:none}
.quick-reply-btn{white-space:nowrap;padding:7px 15px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:#c9cbe0;font-size:13px;font-weight:600}
.quick-reply-btn:hover{background:rgba(139,92,246,.2);color:#fff;border-color:var(--primary)}

.chat-input{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:10px;background:rgba(0,0,0,.22);align-items:center}
.chat-input input{flex:1;padding:12px 18px;border-radius:26px;background:rgba(255,255,255,.06);border:1px solid var(--border);font-size:14.5px;min-width:0}
.chat-input input:focus{border-color:var(--primary)}
.chat-input input:disabled{opacity:.5}
.send-btn,.mic-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.send-btn{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.send-btn svg{transform:scaleX(-1)}
.send-btn:disabled{opacity:.45;box-shadow:none}
.mic-btn{background:var(--surface-2);border:1px solid var(--border)}
.mic-btn.recording{background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,63,94,.6)}70%{box-shadow:0 0 0 14px rgba(244,63,94,0)}100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}}

/* ================= CALLS ================= */
.call-modal{position:fixed;inset:0;z-index:100000;background:#05050a;display:flex;flex-direction:column}
.call-video-container{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2a1a52,#05050a 70%)}
#remoteVideo{width:100%;height:100%;object-fit:cover}
#localVideo{position:absolute;bottom:18px;inset-inline-start:18px;width:112px;height:150px;object-fit:cover;border-radius:18px;border:2px solid rgba(255,255,255,.35);z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.call-voice{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.call-voice .avatar{width:120px;height:120px;font-size:44px;box-shadow:0 0 0 14px rgba(139,92,246,.15),0 0 0 30px rgba(139,92,246,.07)}
.call-controls{padding:24px calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:18px;background:rgba(0,0,0,.6);backdrop-filter:blur(14px)}
.call-btn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14)}
.call-btn.end{background:var(--danger);box-shadow:0 8px 24px rgba(244,63,94,.5)}
.call-btn.accept{background:var(--ok);box-shadow:0 8px 24px rgba(34,197,94,.5)}
.call-btn.off{background:#fff;color:#111}
.incoming-call-modal{position:fixed;inset:0;z-index:100001;background:radial-gradient(circle at 50% 30%,rgba(60,30,120,.95),rgba(5,5,10,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(14px);gap:6px}
.incoming-call-modal .avatar{width:110px;height:110px;font-size:40px;margin-bottom:18px;animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(139,92,246,.6)}100%{box-shadow:0 0 0 40px rgba(139,92,246,0)}}
.incoming-call-modal .call-actions{display:flex;gap:40px;margin-top:40px}

/* ================= FRIENDS ================= */
.friends-header{padding:26px 22px;background:var(--grad-soft);border-radius:var(--r-lg);margin-bottom:18px;border:1px solid var(--border);text-align:center}
.friends-header h2{font-size:24px;font-weight:900;margin-bottom:4px}
.friends-tabs{display:flex;gap:6px;margin-bottom:16px;padding:5px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid var(--border);overflow-x:auto}
.friends-tab{flex:1;padding:10px 14px;text-align:center;border-radius:14px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.friends-tab.active{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.friend-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:10px;transition:.2s}
.friend-card:hover{border-color:var(--border-2);transform:translateY(-1px)}
.friend-card .avatar{width:54px;height:54px}
.friend-info{flex:1;cursor:pointer;min-width:0}
.friend-info strong{display:block;font-size:15.5px;line-height:1.35}
.friend-actions{display:flex;gap:8px}
.btn-accept{background:var(--grad);color:#fff;padding:9px 18px;border-radius:12px;font-weight:800;font-size:13px}
.btn-decline{background:var(--surface-2);border:1px solid var(--border);padding:9px 16px;border-radius:12px;font-weight:700;font-size:13px}
.btn-add{background:rgba(139,92,246,.15);color:var(--primary-2);border:1px solid rgba(139,92,246,.45);padding:9px 16px;border-radius:12px;font-weight:800;font-size:13px}
.btn-add:hover{background:var(--primary);color:#fff}

.panel-title{font-size:16px;font-weight:900;padding:18px 18px 8px;display:flex;align-items:center;gap:8px}
.panel-title i{color:var(--primary-2)}
.suggestion-row{display:flex;align-items:center;gap:10px;margin:0 8px 4px;padding:9px 10px;border-radius:16px;transition:.2s}
.suggestion-row:hover{background:var(--surface)}
.suggestion-row .avatar{width:42px;height:42px}
.suggestion-info{flex:1;cursor:pointer;min-width:0;line-height:1.35}
.suggestion-info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggestion-info span{font-size:11.5px;color:var(--muted)}
.btn-suggest-add{background:rgba(139,92,246,.15);color:var(--primary-2);border:1px solid rgba(139,92,246,.45);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:800}
.btn-suggest-add:hover{background:var(--primary);color:#fff}
.panel-more{margin:8px 14px 16px;width:calc(100% - 28px);padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:13px;color:#d6d8ea}
.panel-more:hover{border-color:var(--primary)}

/* ================= MODALS ================= */
.modal-overlay{position:fixed;inset:0;z-index:99999;background:rgba(3,3,8,.78);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeOv .2s}
@keyframes fadeOv{from{opacity:0}to{opacity:1}}
.modal-content{background:linear-gradient(180deg,#171726,#0f0f1a);border:1px solid var(--border-2);border-radius:28px;width:100%;max-width:500px;padding:22px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-weight:900;font-size:18px}
.modal-close{background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.modal-close:hover{background:var(--danger)}
.form-label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;margin-top:14px;font-weight:600}
.form-input{width:100%;padding:13px 15px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--border);font-size:14.5px}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.14)}
textarea.form-input{resize:vertical}
.btn-save{width:100%;padding:14px;border-radius:14px;background:var(--grad);color:#fff;font-weight:800;margin-top:20px;box-shadow:var(--glow)}
.notif-item{display:flex;gap:12px;padding:11px;align-items:center;cursor:pointer;border-radius:16px;transition:.2s}
.notif-item:hover{background:var(--surface-2)}
.notif-item .avatar{width:44px;height:44px}
.notif-text{flex:1;font-size:14px;line-height:1.45}
.notif-time{font-size:11px;color:var(--muted)}
.comments-list{max-height:320px;overflow-y:auto;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.comment-item{display:flex;gap:10px;background:var(--surface);padding:10px 12px;border-radius:16px}
.comment-item .avatar{width:34px;height:34px;font-size:13px}
.comment-item .text{font-size:13.5px;flex:1}
.comment-item .name{font-weight:800;color:var(--primary-2);font-size:12.5px;display:block;cursor:pointer}
.post-options-list{display:flex;flex-direction:column}
.post-option-btn{padding:17px;font-size:15.5px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px}
.post-option-btn:last-child{border-bottom:none;color:var(--muted)}
.post-option-btn:hover{background:var(--surface)}
.post-option-btn.danger{color:var(--danger)}
.privacy-text p{margin-bottom:10px;color:#cfd1e6;font-size:14.5px}

/* ================= REELS ================= */
.reels-overlay-container{position:fixed;inset:0;z-index:9990;background:#000;display:flex;flex-direction:column;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-overlay-container::-webkit-scrollbar{display:none}
.reel-slide{position:relative;width:100%;height:100vh;height:100dvh;flex-shrink:0;scroll-snap-align:start;background:#000}
.reel-video{width:100%;height:100%;object-fit:cover}
.reel-gradient-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.15) 35%,transparent 60%),linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 16%);pointer-events:none}
.reel-top-bar{position:absolute;top:20px;left:0;right:0;display:flex;justify-content:center;gap:22px;color:#fff;font-weight:700;z-index:10}
.reel-top-bar span{opacity:.6;font-size:15px}
.reel-top-bar span.active{opacity:1;border-bottom:2px solid #fff;padding-bottom:2px}
.reel-close-btn{position:absolute;top:14px;inset-inline-start:14px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;z-index:11}
.reel-side-actions{position:absolute;inset-inline-start:14px;bottom:130px;display:flex;flex-direction:column;gap:20px;z-index:10;align-items:center}
.reel-action-btn{display:flex;flex-direction:column;align-items:center;color:#fff;gap:4px;font-size:12px;font-weight:700;cursor:pointer}
.reel-action-icon{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.22)}
.reel-action-btn.liked .reel-action-icon{color:var(--accent);background:rgba(236,72,153,.3)}
.reel-action-btn.liked svg{fill:var(--accent)}
.reel-bottom-info{position:absolute;bottom:28px;inset-inline-end:16px;inset-inline-start:84px;color:#fff;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.reel-user-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.reel-user-row .avatar{width:38px;height:38px;border:2px solid #fff}
.reel-user-name{font-weight:800;font-size:15px;cursor:pointer}
.reel-caption{font-size:14px;line-height:1.55;margin-bottom:8px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.reel-tags{font-size:12.5px;opacity:.9}
.reel-music-disc{width:34px;height:34px;border-radius:50%;background:#222;border:5px solid #111;display:grid;place-items:center;font-size:12px;animation:spin 4s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
.reel-add{position:fixed;top:14px;inset-inline-end:14px;z-index:9999}
.reel-add label{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:30px;background:var(--grad);color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:var(--glow)}

/* ================= VOICE ROOMS ================= */
.rooms-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:26px 24px;border-radius:var(--r-lg);border:1px solid var(--border);background:linear-gradient(135deg,rgba(124,58,237,.38),rgba(236,72,153,.18) 60%,rgba(7,7,13,.35));margin-bottom:18px}
.rh-glow{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.45),transparent 70%);top:-140px;inset-inline-end:-70px;pointer-events:none}
.rh-text{flex:1;min-width:200px;position:relative}
.rh-kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px;margin-bottom:8px}
.rh-text h2{font-size:26px;font-weight:900;line-height:1.3}
.rh-text p{color:#d6d8ea;font-size:14px}
.rh-create{width:auto;position:relative;padding:12px 22px;border-radius:16px;display:inline-flex;align-items:center;gap:8px}

.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.room-card{position:relative;cursor:pointer;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.room-card:hover{transform:translateY(-3px);border-color:var(--border-2);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.room-card.premium{border-color:rgba(250,204,21,.6);box-shadow:0 0 0 1px rgba(250,204,21,.18),0 12px 34px rgba(250,204,21,.14)}
.rc-cover{height:118px;background:var(--cover);position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:12px}
.rc-cover::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.rc-count,.rc-premium{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.rc-premium{background:linear-gradient(135deg,#facc15,#f59e0b);color:#1f1300}
.rc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.rc-body h3{font-size:16px;font-weight:900;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-body p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rc-host{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#d6d8ea;min-width:0}
.rc-host .avatar{width:28px;height:28px;font-size:12px}
.rc-host span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.rc-stack{display:flex;align-items:center;flex-shrink:0}
.rc-mini{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface-solid);background:var(--grad);display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;overflow:hidden}
.rc-stack .rc-mini + .rc-mini{margin-inline-start:-8px}
.rc-mini img{width:100%;height:100%;object-fit:cover}

.cover-pick{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.cp{width:44px;height:44px;border-radius:14px;border:2px solid transparent;transition:.2s}
.cp.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(139,92,246,.5);transform:scale(1.06)}
.premium-toggle{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px;border-radius:18px;background:rgba(250,204,21,.07);border:1px solid rgba(250,204,21,.3);cursor:pointer}
.premium-toggle.locked{opacity:.55;cursor:not-allowed;background:var(--surface);border-color:var(--border)}
.premium-toggle input{margin-top:4px;width:18px;height:18px;accent-color:#f59e0b;flex-shrink:0}
.pt-text{display:flex;flex-direction:column;gap:4px}
.pt-text b{font-size:14.5px;display:inline-flex;align-items:center;gap:6px;color:#fde68a}
.pt-text small{color:var(--muted);font-size:12.5px;line-height:1.5}

/* full-screen room */
.room-view{position:fixed;inset:0;z-index:100003;background:#06060c;display:flex;flex-direction:column;overflow:hidden;color:#fff;animation:fadeIn .3s var(--ease)}
.rv-bg{position:absolute;inset:-60px;opacity:.5;filter:blur(70px);pointer-events:none}
.room-view>*:not(.rv-bg){position:relative;z-index:1}
.rv-head{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.rv-title{flex:1;min-width:0}
.rv-title h3{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-title span{font-size:12.5px;color:#cfd2e6;display:inline-flex;gap:6px;align-items:center}
.rv-title .gold{color:#facc15;font-weight:800}
.rv-btn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
.rv-btn.danger{background:rgba(244,63,94,.28)}
.rv-seats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:26px 14px 10px;justify-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:7px;width:100%;min-width:0}
.seat-ring{position:relative;width:74px;height:74px;border-radius:50%;padding:3px;background:rgba(255,255,255,.14);transition:background .25s,box-shadow .25s}
.seat.talking .seat-ring{background:var(--grad-ring);box-shadow:0 0 0 4px rgba(236,72,153,.2),0 0 26px rgba(139,92,246,.75);animation:talk 1s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.07)}}
.seat.host .seat-ring{background:linear-gradient(135deg,#facc15,#f59e0b)}
.seat-av{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:24px;border:3px solid #0b0b14}
.seat-av img{width:100%;height:100%;object-fit:cover}
.seat.empty .seat-av{background:rgba(255,255,255,.05);color:#6b6e86;font-size:24px;border:2px dashed rgba(255,255,255,.2)}
.seat-mute,.seat-crown{position:absolute;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.seat-mute{bottom:-2px;inset-inline-end:-2px;background:#f43f5e;color:#fff;border:2px solid #06060c}
.seat-crown{top:-8px;inset-inline-start:50%;transform:translateX(50%);background:#facc15;color:#2a1700;border:2px solid #06060c}
.seat-name{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.rv-listeners{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 12px;justify-content:center;max-height:28vh;overflow-y:auto}
.rv-chip-label{width:100%;text-align:center;font-size:12px;color:#aab0c9;font-weight:700}
.lis-chip{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:20px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:600}
.lis-chip .mini{width:26px;height:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:11px;font-weight:800;overflow:hidden}
.lis-chip .mini img{width:100%;height:100%;object-fit:cover}
.rv-bar{margin-top:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:22px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)}
.rv-micwrap{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#cfd2e6}
.rv-mic{width:78px;height:78px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:var(--glow)}
.rv-mic.off{background:rgba(255,255,255,.14);box-shadow:none}
.rv-mic:disabled{opacity:.5}
.rv-leave{height:50px;padding:0 26px;border-radius:25px;background:rgba(244,63,94,.92);color:#fff;font-weight:800;box-shadow:0 8px 24px rgba(244,63,94,.4)}

@media(max-width:820px){
  .rooms-grid{grid-template-columns:1fr}
  .rh-create{width:100%;justify-content:center}
  .rooms-hero{padding:22px 18px}
  .mobile-nav button{min-width:50px;padding:8px 6px;font-size:10px}
  .rv-seats{grid-template-columns:repeat(4,1fr);gap:16px 4px}
  .seat-ring{width:66px;height:66px}
}

/* ================= MODERATION ================= */
.mod-overlay{position:fixed;inset:0;z-index:100010;background:rgba(3,3,8,.7);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fadeOv .2s}

.intro-splash{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2a1a52 0%,#0c0a18 55%,#05050a 100%);transition:opacity .6s ease,visibility .6s;}
.intro-splash.out{opacity:0;visibility:hidden;}
.intro-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(192,38,211,.45),rgba(124,58,237,.18) 45%,transparent 70%);filter:blur(10px);animation:introGlow 2.4s ease-in-out infinite alternate;}
.intro-inner{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;}
.intro-logo{width:132px;height:132px;border-radius:34px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 40px rgba(192,38,211,.55),0 0 90px rgba(124,58,237,.35);animation:introPop .9s cubic-bezier(.2,.9,.25,1.2) both;}
.intro-name{margin-top:22px;font-size:46px;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#c4b5fd,#e879f9 55%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;animation:introRise .9s .25s ease both;}
.intro-tag{margin-top:8px;font-size:15px;color:#cfd2e6;font-weight:700;animation:introRise .9s .45s ease both;}
.intro-bar{margin-top:30px;width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;animation:introRise .6s .6s ease both;}
.intro-bar span{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#7c3aed,#c026d3,#ec4899);animation:introLoad 2.1s .6s ease forwards;}
@keyframes introPop{from{opacity:0;transform:scale(.6) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-4deg)}}
@keyframes introRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes introLoad{from{width:0}to{width:100%}}
@keyframes introGlow{from{transform:scale(.9);opacity:.7}to{transform:scale(1.12);opacity:1}}
@media (prefers-reduced-motion: reduce){.intro-splash *,.intro-splash{animation:none!important;transition:none!important}}
</style>
</head>

<div id="introSplash" class="intro-splash" aria-hidden="true">
  <div class="intro-glow"></div>
  <div class="intro-inner">

    <div class="intro-bar"><span></span></div>
  </div>

<script>
(function(){
  var el = document.getElementById('introSplash');
  if (!el) return;
  var start = Date.now();
  function hide(){
    var wait = Math.max(0, 2600 - (Date.now() - start));
    setTimeout(function(){
      el.classList.add('out');
      setTimeout(function(){ el.remove(); }, 600);
    }, wait);
  }
  if (document.readyState === 'complete') hide(); else window.addEventListener('load', hide);
  setTimeout(function(){ if (document.getElementById('introSplash')) { el.classList.add('out'); setTimeout(function(){ el.remove(); }, 600); } }, 5000);
})();
</script>

function ico(n, s = 20) { return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`; }
function hydrateIcons(root = document) { root.querySelectorAll('[data-ico]').forEach(el => { if (!el.firstChild) el.innerHTML = ico(el.dataset.ico, +el.dataset.s || 20); }); }
hydrateIcons();

// ================= UTILS =================
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('toastBox').appendChild(t); setTimeout(() => t.remove(), 3000); }
function esc(str) { return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(d) { const s=(Date.now()-new Date(d).getTime())/1000; if(s<60)return'الآن'; if(s<3600)return`منذ ${Math.floor(s/60)}د`; if(s<86400)return`منذ ${Math.floor(s/3600)}س`; return`منذ ${Math.floor(s/86400)}ي`; }
function avatarHtml(p) {
  if(!p) return `<div class="avatar">و</div>`;
  const clickAttr = p.id ? `onclick="event.stopPropagation(); viewUserProfile('${p.id}')"` : '';
  const inner = `<div class="avatar" ${clickAttr}>${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : esc(p.full_name?.[0] || 'و')}</div>`;
  return p.frame === 'shield' ? `<div class="av-frame" ${clickAttr}>${inner}<img class="av-ring" src="${SHIELD_IMG}" alt=""></div>` : inner;
}
const loaderHtml = '<div class="loader"></div>';
const emptyHtml = (icon, text) => `<div class="empty"><div class="e-ico">${ico(icon, 28)}</div><div>${text}</div></div>`;

const BAD_WORDS_REGEX = /(ك\s*س\s*م|ش\s*ر\s*م\s*و\s*ط|ع\s*ر\s*ص|خ\s*و\s*ل|ن\s*ي\s*ك|ط\s*ي\s*ز|ز\s*ب\s*ي|ق\s*ح\s*ب\s*ة|م\s*ت\s*ن\s*ا\s*ك|ا\s*ب\s*ن\s*ا\s*ل\s*ك\s*ل\s*ب|ح\s*ي\s*و\s*ا\s*ن|ا\s*ب\s*ت\s*ز\s*ا\s*ز)/i;
function moderateText(text) { if (!text) return { ok: true }; if (BAD_WORDS_REGEX.test(text)) return { ok: false, reason: '⚠️ يرجى الالتزام بالآداب العامة.' }; return { ok: true }; }

  $('nameGroup').classList.toggle('hidden', !signup);
  $('btnLogin').classList.toggle('hidden', signup);

$('btnLogin').onclick = async () => {
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email: $('authEmail').value, password: $('authPassword').value });
  if (error) return toast('خطأ: ' + error.message); initApp(data.session);
};
$('btnSignup').onclick = async () => {
  const name = $('authName').value.trim(); if (!name) return toast('أدخل اسمك');
  const { data, error } = await supabaseClient.auth.signUp({ email: $('authEmail').value, password: $('authPassword').value, options: { data: { full_name: name } } });
  if (error) return toast('خطأ: ' + error.message);
  if (data.session) { await supabaseClient.from('profiles').insert({ id: data.user.id, full_name: name }); initApp(data.session); }
  else toast('تحقق من بريدك الإلكتروني لتأكيد الحساب ✉️');
};

async function initApp(session) {
  if (!session) return;
  $('authScreen').classList.add('hidden'); $('appScreen').classList.remove('hidden');
  const { data } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
  me = data || { id: session.user.id, full_name: 'مستخدم' };
  updateIdentity();
  loadStories(); loadFeed(); loadSuggestions();
  listenForIncomingCalls();
  initPush();
  checkAdmin();
  setTimeout(handleLaunchParams, 700);
}
supabaseClient.auth.getSession().then(({ data }) => { if (data.session) initApp(data.session); });

// ================= NAVIGATION =================
function setActiveNav(page) {
  document.querySelectorAll('[data-page]').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`[data-page="${page}"]`).forEach(b => b.classList.add('active'));
}
document.querySelectorAll('[data-page]').forEach(btn => {
  btn.onclick = () => {
    const page = btn.dataset.page;
    if (page === 'reels') { setActiveNav('reels'); openFullscreenReels(); return; }
    if (page === 'rooms') { renderRoomsPage(); return; }
    if (page === 'admin') { renderAdmin(); return; }
    stopRoomWatchers();
    currentPage = page;
    setActiveNav(page);
    $('homePage').classList.toggle('hidden', page !== 'home');
    $('otherPage').classList.toggle('hidden', page === 'home');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (page === 'messages') renderMessages();
    if (page === 'friends') renderFriendsPage();
    if (page === 'profile') renderProfile(me.id);
  };
});

// ================= SUGGESTIONS =================
async function loadSuggestions() {
  const container = $('suggestions');
  container.innerHTML = loaderHtml;
  const { data: friendships } = await supabaseClient.from('friendships').select('requester_id, addressee_id, status').or(`requester_id.eq.${me.id},addressee_id.eq.${me.id}`);
  const relatedIds = new Set();
  if (friendships) friendships.forEach(f => relatedIds.add(f.requester_id === me.id ? f.addressee_id : f.requester_id));
  const excludedIds = [me.id, ...Array.from(relatedIds)];
  const { data: profiles, error } = await supabaseClient.from('profiles').select('*').not('id', 'in', `(${excludedIds.join(',')})`).limit(5);
  if (error || !profiles || profiles.length === 0) { container.innerHTML = '<div class="muted" style="text-align:center;padding:10px 0 4px">لا توجد اقتراحات حالياً.</div>'; return; }
  container.innerHTML = profiles.map(p => {
    profileCache[p.id] = p;
    return `
    <div class="suggestion-row">
      ${avatarHtml(p)}
      <div class="suggestion-info" onclick="viewUserProfile('${p.id}')">
        <strong>${esc(p.full_name)} ${p.is_verified ? '<span class="verified-badge"></span>' : ''}</strong>
        <span>@${esc(p.username || 'user')}</span>
      </div>
      <button class="btn-suggest-add" onclick="sendFriendRequest('${p.id}', this)">إضافة</button>
    </div>`;
  }).join('');
}

window.openChat = async (uid, el) => {
  currentChatUser = uid;
  if (!$('chatWindowContainer')) return;
  if (window.innerWidth <= 820) {
    $('chatSidebarContainer').classList.remove('active');
    $('chatWindowContainer').classList.add('active');
  }
  document.querySelectorAll('.chat-person').forEach(x => x.classList.toggle('active', x.dataset.id === uid));

  const p = profileCache[uid] || {full_name: 'مستخدم'};
  $('chatHead').style.color = '';
  $('chatHead').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;">
      ${avatarHtml(p)}
      <div class="chat-header-info" onclick="viewUserProfile('${uid}')">
        <div class="name">${esc(p.full_name)} ${p.is_verified ? '<span class="verified-badge"></span>' : ''}</div>
        <div class="status">@${esc(p.username || 'user')}</div>
      </div>
    </div>`;
  $('chatHeaderActions').style.display = 'flex';
  $('chatInput').disabled = false;
  $('chatSend').disabled = false;
  $('quickReplies').style.display = 'flex';

  const fetchMsgs = async () => {
    const { data: msgs, error } = await supabaseClient.from('messages')
      .select('*')
      .or(`and(sender_id.eq.${me.id},receiver_id.eq.${uid}),and(sender_id.eq.${uid},receiver_id.eq.${me.id})`)
      .order('created_at', { ascending: true });
    if (error) { toast('تعذر تحميل الرسائل: ' + error.message); return; }
    if (currentChatUser !== uid || !$('chatMsgs')) return;
    if (!msgs.length) { $('chatMsgs').innerHTML = `<div class="chat-placeholder">${emptyHtml('msg', 'لا رسائل بعد — قل مرحباً 👋')}</div>`; return; }
    $('chatMsgs').innerHTML = msgs.map(m => {
      let contentHTML = esc(m.content);
      if (m.content.startsWith('AUDIO_URL::')) contentHTML = `<div class="vm" oncontextmenu="return false"><button class="vm-play" onclick="vmToggle(this)" aria-label="تشغيل">${ico('play', 14)}</button><div class="vm-track" onclick="vmSeek(event, this)"><span class="vm-fill"></span></div><span class="vm-time">0:00</span><audio src="${m.content.replace('AUDIO_URL::', '')}" preload="metadata" controlsList="nodownload noplaybackrate" ontimeupdate="vmTick(this)" onloadedmetadata="vmTick(this)" onended="vmEnd(this)"></audio></div>`;
      return `
      <div class="msg-bubble ${m.sender_id === me.id ? 'me' : 'them'}">
        ${contentHTML}
        <span class="msg-time">${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
      </div>`;
    }).join('');
    $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight;
  };
  await fetchMsgs();

  if (messageChannel) supabaseClient.removeChannel(messageChannel);
  messageChannel = supabaseClient.channel('chat-'+me.id+'-'+uid)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const m = payload.new;
      if ((m.sender_id === me.id && m.receiver_id === uid) || (m.sender_id === uid && m.receiver_id === me.id)) fetchMsgs();
    })
    .subscribe();

};

window.sendMessage = async () => {
  const val = $('chatInput').value.trim(); if (!val || !currentChatUser) return;
  if (!moderateText(val).ok) return toast('الرسالة تحتوي على كلمات ممنوعة.');
  $('chatSend').disabled = true;
  $('chatInput').value = '';
  const ph = $('chatMsgs').querySelector('.chat-placeholder'); if (ph) ph.remove();
  $('chatMsgs').insertAdjacentHTML('beforeend', `<div class="msg-bubble me">${esc(val)}<span class="msg-time">الآن</span></div>`);
  $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight;
  const { error } = await supabaseClient.from('messages').insert({ sender_id: me.id, receiver_id: currentChatUser, content: val });
  $('chatSend').disabled = false;
  if (error) { toast('فشل حفظ الرسالة: ' + error.message); $('chatInput').value = val; }
};
window.sendQuickReply = (text) => { $('chatInput').value = text; $('chatSend').click(); };

const vmFmt = t => { t = Math.max(0, Math.floor(t || 0)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
window.vmToggle = (btn) => {
  const box = btn.closest('.vm'); const a = box?.querySelector('audio'); if (!a) return;
  document.querySelectorAll('.vm audio').forEach(x => { if (x !== a) x.pause(); });
  if (a.paused) a.play().catch(() => toast('تعذر تشغيل الرسالة الصوتية')); else a.pause();
  btn.innerHTML = a.paused ? ico('play', 14) : ico('pause', 14);
};
window.vmTick = (a) => {
  const box = a.closest('.vm'); if (!box) return;
  const pct = a.duration ? (a.currentTime / a.duration) * 100 : 0;
  box.querySelector('.vm-fill').style.width = pct + '%';
  box.querySelector('.vm-time').textContent = vmFmt(a.paused && !a.currentTime ? a.duration : a.currentTime);
};
window.vmSeek = (e, track) => {
  const a = track.closest('.vm')?.querySelector('audio'); if (!a || !a.duration) return;
  const r = track.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  a.currentTime = ratio * a.duration;
};
window.vmEnd = (a) => {
  const box = a.closest('.vm'); if (!box) return;
  box.querySelector('.vm-fill').style.width = '0%';
  box.querySelector('.vm-play').innerHTML = ico('play', 14);
  box.querySelector('.vm-time').textContent = vmFmt(a.duration);
};

// صوت تنبيه داخل التطبيق عند وصول إشعار والتطبيق مفتوح
window.playNotifySound = () => {
  try {
    const ctx = window.__notifyCtx || (window.__notifyCtx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    [[880, 0], [1320, 0.14]].forEach(([f, t]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.22);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.25);
    });
  } catch (e) {}
};

window.toggleRecording = async () => {
  const micBtn = $('micBtn');
  if (!currentChatUser) return toast('اختر محادثة أولاً');
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); micBtn.classList.remove('recording'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      audioChunks = [];
      stream.getTracks().forEach(track => track.stop());
      toast('جاري رفع الرسالة الصوتية...');
      const fileName = `audio_${Date.now()}.webm`;
      const { error } = await supabaseClient.storage.from('post-images').upload(fileName, audioBlob);
      if (error) return toast('فشل رفع الصوت: ' + error.message);
      const { data } = supabaseClient.storage.from('post-images').getPublicUrl(fileName);
      await supabaseClient.from('messages').insert({ sender_id: me.id, receiver_id: currentChatUser, content: `AUDIO_URL::${data.publicUrl}` });
    };
    mediaRecorder.start();
    micBtn.classList.add('recording');
    toast('جاري التسجيل... اضغط مرة أخرى للإيقاف');
  } catch (err) { toast('يرجى السماح بالوصول للميكروفون.'); }
};

// ================= CALLS (مكالمات صوت وفيديو) =================
// تسلسل المكالمة: ring ← ready ← offer ← answer ← end
// كل الإشارات تمر عبر قنوات مشتركة (subscribed) وتُرسل بعد اكتمال ICE لتجنب فقدان المرشحين
const RTC_CALL_CONFIG = {
  iceTransportPolicy: 'all',
  bundlePolicy: 'max-bundle',
  iceServers: [
    { urls: 'stun:stun.relay.metered.ca:80' },
    { urls: 'turn:continue.metered.live:80', username: 'ca48fbf910d19aedd1f938eb', credential: '0M7OjkuXstJGmTyp' },
    { urls: 'turn:continue.metered.live:443', username: 'ca48fbf910d19aedd1f938eb', credential: '0M7OjkuXstJGmTyp' },
    { urls: 'turn:continue.metered.live:443?transport=tcp', username: 'ca48fbf910d19aedd1f938eb', credential: '0M7OjkuXstJGmTyp' },
    { urls: 'turns:continue.metered.live:443?transport=tcp', username: 'ca48fbf910d19aedd1f938eb', credential: '0M7OjkuXstJGmTyp' }
  ]
};
// ضع اسم تطبيق Metered ومفتاح API هنا
const METERED_HOST = 'continue.metered.live';
const METERED_KEY = '';
async function fetchIceConfig() {
  if (!METERED_HOST || !METERED_KEY) return RTC_CALL_CONFIG;
  try {
    const r = await fetch(`https://${METERED_HOST}/api/v1/turn/credentials?apiKey=${encodeURIComponent(METERED_KEY)}`);
    if (!r.ok) throw new Error('metered ' + r.status);
    const servers = await r.json();
    return { iceTransportPolicy: 'all', bundlePolicy: 'max-bundle',
             iceServers: [...servers, { urls: 'stun:stun.l.google.com:19302' }] };
  } catch (e) {
    console.warn('TURN credentials', e);
    return RTC_CALL_CONFIG;
  }
}
let call = null, userCh = null;
const pairIdOf = (a, b) => [a, b].sort().join('_');
const descOf = pc => ({ type: pc.localDescription.type, sdp: pc.localDescription.sdp });

function listenForIncomingCalls() {
  if (userCh) return;
  // كل إشارات المكالمة تمر عبر جدول call_signals فقط
  userCh = supabaseClient.channel('db-calls-' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'call_signals', filter: 'to_user=eq.' + me.id },
      ({ new: row }) => onCallRow(row))
    .subscribe();
}

// توجيه صفوف الجدول: رنين جديد أو إشارة لمكالمة جارية
const seenSigIds = new Set();
let sigPollTimer = null;
// احتياط: قراءة الإشارات من الجدول كل 1.5 ثانية أثناء المكالمة، إن فاتت Realtime أي صف
function pollCallSignals(c) {
  clearInterval(sigPollTimer);
  sigPollTimer = setInterval(async () => {
    if (call !== c) return clearInterval(sigPollTimer);
    const { data } = await supabaseClient.from('call_signals').select('*')
      .eq('to_user', me.id).eq('call_id', c.id).order('id', { ascending: true }).limit(50);
    (data || []).forEach(onCallRow);
  }, 1500);
}

function onCallRow(r) {
  if (!r || r.to_user !== me.id) return;
  if (r.id != null) { if (seenSigIds.has(r.id)) return; seenSigIds.add(r.id); }
  if (r.kind === 'ring') {
    if (!call) onRing({ from: r.from_user, call_id: r.call_id, isVideo: !!r.payload?.isVideo, name: r.payload?.name });
    return;
  }
  if (call && r.call_id === call.id && r.from_user === call.peer) onSig({ ...(r.payload || {}), kind: r.kind });
}

function openPairChannel(c) {
  if (c.role === 'callee') {
    // المستقبل يعلن جاهزيته كل ثانيتين حتى تصله إشارة العرض (offer)
    const beat = () => { if (call !== c || c.gotOffer) return; sendSig(c, { kind: 'ready' }); c.readyTimer = setTimeout(beat, 2000); };
    beat();
  }
  return true;
}

function sendSig(c, payload) {
  if (!c?.id || !c.peer) return;
  supabaseClient.from('call_signals').insert({ call_id: c.id, from_user: me.id, to_user: c.peer, kind: payload.kind, payload })
    .then(({ error }) => { if (error) console.warn('call signal insert', error); });
}

async function onRing(p) {
  if (call) return; // مشغول
  call = { id: p.call_id, peer: p.from, isVideo: !!p.isVideo, role: 'callee',
           pc: null, stream: null, pairCh: null, accepted: false, answered: false, offer: null, muted: false, camOff: false };
  const c = call;
  if (!profileCache[p.from]) {
    const { data } = await supabaseClient.from('profiles').select('*').eq('id', p.from).maybeSingle();
    if (data) profileCache[data.id] = data;
  }
  pollCallSignals(c);
  showCallOverlay('مكالمة واردة…', profileCache[p.from] || { full_name: p.name || 'مستخدم' });
  c.pairCh = openPairChannel(c);
  c.timeout = setTimeout(() => { if (call === c && !c.accepted) { sendSig(c, { kind: 'end' }); endCall(false); } }, 45000);
}

window.startCall = async (isVideo) => {
  if (!currentChatUser) return toast('اختر محادثة أولاً');
  if (call) return toast('هناك مكالمة جارية بالفعل');
  const peer = currentChatUser;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo }); }
  catch (e) { return toast('تعذر الوصول للميكروفون أو الكاميرا. تأكد من الصلاحيات.'); }
  call = { id: pairIdOf(me.id, peer) + '_' + Date.now(), peer, isVideo: !!isVideo, role: 'caller', pc: null, stream,
           pairCh: null, accepted: true, connected: false, muted: false, camOff: false };
  const c = call;
  pollCallSignals(c);
  c.iceCfg = await fetchIceConfig();
  if (!profileCache[peer]) {
    const { data } = await supabaseClient.from('profiles').select('*').eq('id', peer).maybeSingle();
    if (data) profileCache[data.id] = data;
  }
  showCallOverlay('جارٍ الاتصال…', profileCache[peer] || { full_name: 'مستخدم' });
  c.pairCh = openPairChannel(c);
  c.timeout = setTimeout(() => {
    if (call !== c || c.connected) return;
    toast(c.gotAnswer ? 'تعذر إنشاء الاتصال بين الجهازين. جرّب Wi-Fi أو شبكة أخرى' : 'لم يرد المستخدم');
    endCall(true);
  }, 45000);

  // إرسال إشعار الرنين عبر جدول call_signals
  const { error: ringErr } = await supabaseClient.from('call_signals').insert({ call_id: c.id, from_user: me.id, to_user: peer, kind: 'ring', payload: { isVideo: !!isVideo, name: me.full_name } });
  if (ringErr) { toast('تعذر إرسال الاتصال. تأكد من تشغيل جدول call_signals'); endCall(false); }
};

async function onSig(p) {
  const c = call; if (!c) return;
  try {
    if (p.kind === 'ready' && c.role === 'caller' && !c.offered) {
      c.offered = true;
      setCallStatus('تم الرد… جارٍ إرسال بيانات الاتصال');
      c.pc = makePC(c);
      c.stream.getTracks().forEach(t => c.pc.addTrack(t, c.stream));
      await c.pc.setLocalDescription(await c.pc.createOffer());
      await waitIce(c.pc);
      sendSig(c, { kind: 'offer', sdp: descOf(c.pc) });
    } else if (p.kind === 'offer' && p.restart && c.role === 'callee' && c.pc) {
      // إعادة تفاوض بعد انقطاع الشبكة
      await c.pc.setRemoteDescription(p.sdp);
      await c.pc.setLocalDescription(await c.pc.createAnswer());
      await waitIce(c.pc);
      sendSig(c, { kind: 'answer', sdp: descOf(c.pc), restart: true });
    } else if (p.kind === 'offer' && c.role === 'callee' && !c.gotOffer) {
      c.gotOffer = true;
      clearTimeout(c.readyTimer);
      c.offer = p.sdp;
      setCallStatus('وصلت بيانات الاتصال… جارٍ الرد');
      if (c.stream && !c.answered) await makeAnswer(c);
    } else if (p.kind === 'answer' && c.role === 'caller' && c.pc) {
      c.gotAnswer = true;
      setCallStatus('تم استلام الرد… جارٍ تبادل مسارات الشبكة');
      await c.pc.setRemoteDescription(p.sdp);
    } else if (p.kind === 'end') {
      endCall(false);
      toast('انتهت المكالمة');
    }
  } catch (e) {
    console.warn('call signal', e);
    toast('تعذر إتمام المكالمة');
    endCall(true);
  }
}

function makePC(c) {
  const pc = new RTCPeerConnection(c.iceCfg || RTC_CALL_CONFIG);
  pc.ontrack = e => {
    const stream = e.streams[0] || new MediaStream([e.track]);
    if (e.track.kind === 'audio') {
      const a = $('callAudio');
      if (a) { a.srcObject = stream; playRemoteAudio(a); }
    } else if (e.track.kind === 'video') {
      const rv = $('callRemote');
      if (rv) { rv.srcObject = stream; rv.play?.().catch(() => {}); }
      if ($('callVoice')) $('callVoice').style.display = 'none';
    }
  };
  pc.onconnectionstatechange = () => {
    if (call !== c) return;
    const st = pc.connectionState;
    if (st === 'connected') { c.connected = true; clearTimeout(c.disconnectTimer); setCallStatus('متصل'); startCallTimer(c); }
    if (st === 'connecting') setCallStatus('جارٍ الاتصال…');
    if (st === 'disconnected') {
      setCallStatus('انقطع الاتصال… جارٍ الاستعادة');
      c.disconnectTimer = setTimeout(() => { if (call === c) { toast('انقطع الاتصال'); endCall(true); } }, 8000);
    }
    if (st === 'failed') {
      // محاولة استعادة الاتصال مرة واحدة عبر إعادة التفاوض (مفيد عند التنقل بين Wi-Fi وبيانات الهاتف)
      if (c.role === 'caller' && !c.restartTried) { c.restartTried = true; restartCallIce(c); return; }
      toast('تعذر الاتصال بين الجهازين. جرّب Wi-Fi أو شبكة أخرى');
      endCall(true);
    }
  };
  pc.oniceconnectionstatechange = () => {
    if (call !== c) return;
    const ice = pc.iceConnectionState;
    if (ice === 'checking') setCallStatus('تبادل مسارات الشبكة…');
    if (ice === 'failed') { toast('تعذر المرور عبر الشبكة. جرّب Wi-Fi أو شبكة أخرى'); endCall(true); }
  };
  return pc;
}

function startCallTimer(c) {
  if (c.timerIv) return;
  c.startedAt = Date.now();
  const tick = () => {
    const el = $('callTimer'); if (!el || call !== c) return;
    const sec = Math.floor((Date.now() - c.startedAt) / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, '0'), ss = String(sec % 60).padStart(2, '0');
    el.textContent = `${mm}:${ss}`;
  };
  tick();
  c.timerIv = setInterval(tick, 1000);
}

// تشغيل صوت الطرف الآخر؛ إن منع المتصفح التشغيل التلقائي ننتظر أول نقرة للمستخدم
function playRemoteAudio(a) {
  const p = a.play?.();
  if (!p) return;
  p.catch(() => {
    const unlock = () => {
      a.play().then(() => document.removeEventListener('click', unlock, true)).catch(() => {});
    };
    document.addEventListener('click', unlock, true);
    toast('اضغط على الشاشة لتفعيل صوت المكالمة');
  });
}

// إعادة إنشاء مسار الاتصال من جهة المتصل دون إنهاء المكالمة
async function restartCallIce(c) {
  if (call !== c || !c.pc) return;
  try {
    setCallStatus('جارٍ إعادة الاتصال…');
    await c.pc.setLocalDescription(await c.pc.createOffer({ iceRestart: true }));
    await waitIce(c.pc);
    sendSig(c, { kind: 'offer', sdp: descOf(c.pc), restart: true });
    // إن لم يتصل خلال 15 ثانية تنتهي المكالمة بوضوح
    setTimeout(() => {
      if (call === c && !c.connected) { toast('تعذر الاتصال بين الجهازين. جرّب Wi-Fi أو شبكة أخرى'); endCall(true); }
    }, 15000);
  } catch (e) {
    console.warn('ice restart', e);
    toast('تعذر الاتصال بين الجهازين. جرّب Wi-Fi أو شبكة أخرى');
    endCall(true);
  }
}

function waitIce(pc) {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 5000);
    pc.addEventListener('icegatheringstatechange', () => {
      if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
    });
  });
}

async function makeAnswer(c) {
  c.answered = true;
  c.pc = makePC(c);
  c.stream.getTracks().forEach(t => c.pc.addTrack(t, c.stream));
  await c.pc.setRemoteDescription(c.offer);
  await c.pc.setLocalDescription(await c.pc.createAnswer());
  await waitIce(c.pc);
  setCallStatus('تم إرسال الرد… جارٍ تبادل مسارات الشبكة');
  sendSig(c, { kind: 'answer', sdp: descOf(c.pc) });
}

window.acceptCall = async () => {
  const c = call; if (!c || c.role !== 'callee' || c.accepted) return;
  c.accepted = true;
  clearTimeout(c.timeout);
  c.iceCfg = await fetchIceConfig();
  try { c.stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: c.isVideo }); }
  catch (e) { toast('تعذر الوصول للميكروفون أو الكاميرا'); return rejectCall(); }
  setCallStatus('بانتظار بيانات المتصل…');
  showCallOverlay('بانتظار بيانات المتصل…', profileCache[c.peer] || { full_name: 'مستخدم' });
  if (c.offer) await makeAnswer(c);
};

window.rejectCall = () => {
  if (!call) return;
  sendSig(call, { kind: 'end' });
  endCall(false);
};

window.endCall = (notify = true) => {
  const c = call; if (!c) return;
  if (notify && c.pairCh) sendSig(c, { kind: 'end' });
  call = null;
  clearTimeout(c.timeout);
  clearTimeout(c.readyTimer);
  clearTimeout(c.disconnectTimer);
  clearInterval(c.timerIv);
  clearInterval(sigPollTimer);
  c.pc?.close();
  c.stream?.getTracks().forEach(t => t.stop());
  $('callOverlay')?.remove();
};

function setCallStatus(t) { const el = $('callStatus'); if (el) el.textContent = t; }

function showCallOverlay(status, peer) {
  let el = $('callOverlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'callOverlay';
    el.className = 'call-modal';
    document.body.appendChild(el);
  }
  const c = call;
  const vid = c?.isVideo;
  el.innerHTML = `
    <div class="call-video-container">
      <video id="callRemote" autoplay playsinline ${vid ? '' : 'style="display:none"'}></video>
      <div class="call-voice" id="callVoice">
        ${avatarHtml({ ...peer, id: null })}
        <h2 style="font-size:24px;font-weight:900;margin-top:10px">${esc(peer.full_name || 'مستخدم')}</h2>
        <p class="muted" id="callStatus">${esc(status)}</p>
        <p id="callTimer" style="font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:8px;color:#fff"></p>
      </div>
      <video id="callLocal" autoplay playsinline muted ${vid ? '' : 'style="display:none"'}></video>
      <audio id="callAudio" autoplay playsinline></audio>
    </div>
    <div class="call-controls" id="callControls"></div>`;
  if (c?.stream && vid) { const lv = $('callLocal'); if (lv) lv.srcObject = c.stream; }
  renderCallControls();
}

function renderCallControls() {
  const box = $('callControls'); if (!box || !call) return;
  if (call.role === 'callee' && !call.accepted) {
    box.innerHTML = `
      <button class="call-btn end" onclick="rejectCall()" title="رفض">${ico('x', 26)}</button>
      <button class="call-btn accept" onclick="acceptCall()" title="قبول">${ico('phone', 26)}</button>`;
    return;
  }
  box.innerHTML = `
    <button class="call-btn ${call.muted ? 'off' : ''}" onclick="toggleMute()" title="كتم">${ico(call.muted ? 'mutemic' : 'mic', 24)}</button>
    ${call.isVideo ? `<button class="call-btn ${call.camOff ? 'off' : ''}" onclick="toggleCam()" title="الكاميرا">${ico(call.camOff ? 'camoff' : 'video', 24)}</button>` : ''}
    <button class="call-btn end" onclick="endCall(true)" title="إنهاء">${ico('phone', 24)}</button>`;
}

window.toggleMute = () => {
  if (!call?.stream) return;
  call.muted = !call.muted;
  call.stream.getAudioTracks().forEach(t => (t.enabled = !call.muted));
  renderCallControls();
};
window.toggleCam = () => {
  if (!call?.stream) return;
  call.camOff = !call.camOff;
  call.stream.getVideoTracks().forEach(t => (t.enabled = !call.camOff));
  renderCallControls();
};


// ================= FRIENDS =================
async function renderFriendsPage() {
  const host = $('otherPage');
  host.className = 'fade-in';
  host.innerHTML = `
    <div class="friends-header"><h2>الأصدقاء</h2><p class="muted">تواصل مع من يهمك، واكتشف أصدقاء جدد.</p></div>
    <div class="friends-tabs">
      <div class="friends-tab active" onclick="switchFriendTab('requests', this)">طلبات الصداقة</div>
      <div class="friends-tab" onclick="switchFriendTab('friends', this)">أصدقائي</div>
      <div class="friends-tab" onclick="switchFriendTab('suggestions', this)">أشخاص قد تعرفهم</div>
    </div>
    <div id="friendListContainer">${loaderHtml}</div>`;

  const { data: friendships } = await supabaseClient.from('friendships').select('*').or(`requester_id.eq.${me.id},addressee_id.eq.${me.id}`);
  const allFriendships = friendships || [];
  const incomingRequests = allFriendships.filter(f => f.addressee_id === me.id && f.status === 'pending');
  const outgoingRequests = allFriendships.filter(f => f.requester_id === me.id && f.status === 'pending');
  const friends = allFriendships.filter(f => f.status === 'accepted');
  const friendIds = friends.map(f => f.requester_id === me.id ? f.addressee_id : f.requester_id);
  const incomingIds = incomingRequests.map(f => f.requester_id);
  const outgoingIds = outgoingRequests.map(f => f.addressee_id);

  const relatedIds = [...new Set([...friendIds, ...incomingIds, ...outgoingIds])];
  if (relatedIds.length) {
    const { data: profiles } = await supabaseClient.from('profiles').select('*').in('id', relatedIds);
    profiles?.forEach(p => profileCache[p.id] = p);
  }
  const excludedIds = [me.id, ...friendIds, ...incomingIds, ...outgoingIds];
  const { data: suggestions } = await supabaseClient.from('profiles').select('*').not('id', 'in', `(${excludedIds.join(',')})`).limit(20);
  suggestions?.forEach(p => profileCache[p.id] = p);

  window.switchFriendTab = (tab, el) => {
    document.querySelectorAll('.friends-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const container = $('friendListContainer');
    container.className = 'fade-in';
    if (tab === 'requests') {
      if (incomingRequests.length === 0) return container.innerHTML = emptyHtml('users', 'لا توجد طلبات صداقة جديدة.');
      container.innerHTML = incomingRequests.map(req => {
        const p = profileCache[req.requester_id] || { id: req.requester_id, full_name: 'مستخدم' };
        return `<div class="friend-card">
          ${avatarHtml(p)}
          <div class="friend-info" onclick="viewUserProfile('${p.id}')"><strong>${esc(p.full_name)} ${p.is_verified ? '<span class="verified-badge"></span>' : ''}</strong><span class="muted small">يريد إضافتك</span></div>
          <div class="friend-actions">
            <button class="btn-accept" onclick="acceptFriend('${req.id}')">قبول</button>
            <button class="btn-decline" onclick="rejectFriend('${req.id}')">رفض</button>
          </div></div>`;
      }).join('');
    } else if (tab === 'friends') {
      if (friends.length === 0) return container.innerHTML = emptyHtml('users', 'ليس لديك أصدقاء بعد.');
      container.innerHTML = friends.map(f => {
        const uid = f.requester_id === me.id ? f.addressee_id : f.requester_id;
        const p = profileCache[uid] || { id: uid, full_name: 'مستخدم' };
        return `<div class="friend-card">
          ${avatarHtml(p)}
          <div class="friend-info" onclick="viewUserProfile('${p.id}')"><strong>${esc(p.full_name)} ${p.is_verified ? '<span class="verified-badge"></span>' : ''}</strong><span class="muted small">صديق</span></div>
          <div class="friend-actions"><button class="btn-add" onclick="goToChat('${uid}')">مراسلة</button></div></div>`;
      }).join('');
    } else if (tab === 'suggestions') {
      if (!suggestions || suggestions.length === 0) return container.innerHTML = emptyHtml('users', 'لا توجد اقتراحات حالياً.');
      container.innerHTML = suggestions.map(p => {
        const isPending = outgoingIds.includes(p.id);
        return `<div class="friend-card">
          ${avatarHtml(p)}
          <div class="friend-info" onclick="viewUserProfile('${p.id}')"><strong>${esc(p.full_name)} ${p.is_verified ? '<span class="verified-badge"></span>' : ''}</strong><span class="muted small">@${esc(p.username || 'user')}</span></div>
          <div class="friend-actions">${isPending ? `<button class="btn-decline" disabled style="opacity:.5;">تم الإرسال</button>` : `<button class="btn-add" onclick="sendFriendRequest('${p.id}', this)">إضافة</button>`}</div></div>`;
      }).join('');
    }
  };
  switchFriendTab('requests', document.querySelector('.friends-tab'));
}

window.goToChat = (uid) => {
  document.querySelector('.layout [data-page=messages], .mobile-nav [data-page=messages]').click();
  setTimeout(() => openChat(uid), 400);
};
window.sendFriendRequest = async (targetId, btn) => {
  const originalText = btn.textContent;
  btn.textContent = '...'; btn.disabled = true;
  const { error } = await supabaseClient.from('friendships').insert({ requester_id: me.id, addressee_id: targetId, status: 'pending' });
  if (error) { toast('خطأ: ' + error.message); btn.textContent = originalText; btn.disabled = false; }
  else { toast('تم إرسال الطلب ✨'); btn.outerHTML = `<button class="btn-decline" disabled style="opacity:.5;">تم الإرسال</button>`; loadSuggestions(); }
};
window.acceptFriend = async (reqId) => {
  await supabaseClient.from('friendships').update({ status: 'accepted' }).eq('id', reqId);
  toast('تم قبول الصداقة 💜'); renderFriendsPage(); loadSuggestions();
};
window.rejectFriend = async (reqId) => {
  await supabaseClient.from('friendships').delete().eq('id', reqId);
  toast('تم رفض الطلب'); renderFriendsPage();
};
window.viewUserProfile = async (userId) => {
  if (userId === me.id) { document.querySelector('[data-page=profile]').click(); return; }
  document.querySelectorAll('[data-page]').forEach(b => b.classList.remove('active'));

  $('otherPage').classList.remove('hidden');
